<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#06090d" />
  <meta name="color-scheme" content="dark light" />
  <title>LA PAUSE CLUB · Manager</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="v13.css" />
  <link rel="stylesheet" href="v14.css" />
  <link rel="stylesheet" href="v15.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <button class="icon-btn menu-trigger" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="mobile-logo"><img src="logo.svg" alt="" /></div>
      <div class="brand-wrap">
        <div class="eyebrow" id="branchLabel">EL HAJEB</div>
        <div class="brand" id="businessLabel">LA PAUSE CLUB</div>
      </div>
      <div class="top-actions">
        <button class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncText">LOCAL</span></button>
        <button class="avatar-btn" id="profileBtn">PL</button>
      </div>
    </header>

    <div class="subbar">
      <div><span id="todayLabel"></span><strong id="clock"></strong></div>
      <div class="subbar-actions"><button class="mini-btn accent-mini" id="quickStartBtn">＋ Nouvelle session</button></div>
    </div>

    <main id="view" class="view"></main>

    <nav class="bottomnav" id="bottomNav">
      <button class="navbtn active" data-view="floor"><b>▦</b><span>Salle</span></button>
      <button class="navbtn" data-view="sessions"><b>◴</b><span>Sessions</span></button>
      <button class="navbtn" data-view="cash"><b>▣</b><span>Caisse</span></button>
      <button class="navbtn" data-view="reservations"><b>▤</b><span>Réserv.</span></button>
      <button class="navbtn" data-view="more"><b>•••</b><span>Plus</span></button>
    </nav>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head brand-drawer">
      <div class="drawer-brand-row">
        <img src="logo.svg" class="drawer-logo" alt="" />
        <div>
          <div class="drawer-brand-name">LA <span>PAUSE</span> CLUB</div>
          <div class="drawer-brand-sub">MANAGEMENT · MOBILE</div>
        </div>
      </div>
      <button class="icon-btn drawer-x" id="drawerClose">×</button>
    </div>
    <div class="drawer-kpis" id="drawerKpis"></div>

    <div class="drawer-menu">
      <button class="drawer-home" data-go="floor"><span>⌂</span><b>Salle</b></button>

      <div class="drawer-section">EXPLOITATION</div>
      <button data-go="floor"><span>▦</span>Gaming Floor</button>
      <button data-go="sessions"><span>◴</span>Sessions</button>
      <button data-go="reservations"><span>▤</span>Réservations &amp; planning</button>
      <button data-go="passes"><span>◈</span>Pass &amp; abonnements</button>
      <button data-go="queue"><span>♙</span>File intelligente</button>
      <button data-go="history"><span>◔</span>Historique</button>
      <button data-go="incidents"><span>!</span>Incidents</button>

      <div class="drawer-section">COMMERCE</div>
      <button data-go="cash"><span>▣</span>Caisse express</button>
      <button data-go="orders"><span>◉</span>Commandes</button>
      <button data-go="products"><span>◇</span>Produits</button>
      <button data-go="clients"><span>♙</span>Clients / CRM</button>
      <button data-go="loyalty"><span>✦</span>Pause Points</button>
      <button data-go="pricing"><span>▭</span>Tarifs &amp; rendement</button>
      <button data-go="offers"><span>％</span>Offres &amp; cadeaux</button>
      <button data-go="campaigns"><span>◎</span>Campagnes</button>

      <div class="drawer-section">COMMUNAUTÉ</div>
      <button data-go="tournaments"><span>♕</span>Tournois</button>
      <button data-go="king"><span>♛</span>Roi de la PS5</button>
      <button data-go="challenges"><span>◉</span>Challenges</button>
      <button data-go="leaderboard"><span>▥</span>Classements</button>
      <button data-go="hall"><span>★</span>Hall PS5</button>
      <button data-go="mediaConsents"><span>◌</span>Consentements média</button>

      <div class="drawer-section">PARC &amp; TECHNIQUE</div>
      <button data-go="tvstations"><span>▣</span>TV &amp; Stations</button>
      <button data-go="equipment"><span>◉</span>Parc consoles &amp; TV</button>
      <button data-go="controllers"><span>⌁</span>Manettes &amp; accessoires</button>
      <button data-go="inventory"><span>▤</span>Inventaire temps réel</button>
      <button data-go="maintenance"><span>⌁</span>Maintenance préventive</button>
      <button data-go="purchases"><span>⌂</span>Achats</button>

      <div class="drawer-section">PILOTAGE</div>
      <button data-go="overview"><span>▦</span>Vue générale</button>
      <button data-go="revenue"><span>▰</span>Revenus</button>
      <button data-go="occupancy"><span>◫</span>Occupation &amp; rendement</button>
      <button data-go="customerReports"><span>♙</span>Clients &amp; rétention</button>
      <button data-go="closure"><span>◉</span>Clôture de journée</button>

      <div class="drawer-section">ADMINISTRATION</div>
      <button data-go="settings"><span>⚙</span>Paramètres</button>
      <button data-go="team"><span>♙</span>Équipe</button>
      <button data-go="journal"><span>▤</span>Journal sécurité</button>
      <button data-go="dataControl"><span>⇩</span>Données &amp; sauvegardes</button>
      <button data-go="folders"><span>□</span>Dossiers</button>
    </div>

    <div class="drawer-foot">
      <button class="owner-card" data-go="settings">
        <span class="owner-avatar">PL</span>
        <span><b>Propriétaire LA PAUSE CLUB</b><small id="drawerMode">Données locales protégées</small></span>
        <i>•••</i>
      </button>
      <div class="version">LA PAUSE CLUB Manager · v1.5.0</div>
    </div>
  </aside>

  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importInput" accept="application/json,.json" hidden />

  <script src="app.js"></script>
  <script src="v13.js"></script>
  <script src="v14.js"></script>
  <script src="v15.js"></script>
  <script src="stabilize-v160-existing.js"></script>
  <script src="enrich-v160-core.js"></script>
  <script src="enrich-v160-billing.js"></script>
  <script src="enrich-v160-session-profiles.js"></script>
  <script src="enrich-v160-session-form.js"></script>
  <script src="enrich-v160-session-start.js"></script>
  <script src="enrich-v160-session-form-ui.js"></script>
  <script src="enrich-v160-revenue.js"></script>
  <script src="enrich-v160-intelligence.js"></script>
  <script src="enrich-v160-player.js"></script>
  <script src="enrich-v160-finance.js"></script>
  <script src="enrich-v160-client.js"></script>
  <script src="enrich-v160-catalog.js"></script>
  <script src="enrich-v160-community.js"></script>
  <script src="enrich-v160-trust.js"></script>
  <script src="enrich-v160-platform.js"></script>
  <script src="enrich-v160-core-status.js"></script>
  <script src="enrich-v160-device-control.js"></script>
  <!-- V160_FLOOR_RENDERER_OWNER=HISTORIC_V1.6; geometry-only adapter; no auto-persist -->
  <script src="enrich-v160-floor-builder.js"></script>
  <!-- V160_CONTROL_CENTER_OWNER=HISTORIC_V1.6_UI; operator-first calculation only -->
  <script src="enrich-v160-control-center.js"></script>
</body>
</html>
