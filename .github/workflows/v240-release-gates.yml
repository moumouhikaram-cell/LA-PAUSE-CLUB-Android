name: LA PAUSE OS 2.4 Canonical Release Gates

on:
  workflow_dispatch:
  push:
    branches:
      - android-device-control-v240
    paths:
      - "v16-original-source/RELEASE-V240.txt"
      - "v16-original-source/app/**"
      - "v16-original-source/tvagent/**"
      - "v16-original-source/tools/**"
      - "contracts/**"
      - ".github/workflows/v240-release-gates.yml"

permissions:
  contents: read

jobs:
  browser-gates:
    name: gate-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: saas-entitlement-rbac
            spec: tools/saas-entitlement-rbac-v240.spec.js
            marker: SAAS_ROUTE_MODULE_MAP_OK
          - name: next-shell
            spec: tools/client-v240-next-shell.spec.js
            marker: V240_NEW_SETTINGS_HUB_OK
          - name: device-control
            spec: tools/client-v240-device-control.spec.js
            marker: V240_DEVICE_CONTROL_E2E_OK
          - name: operator-ux
            spec: tools/client-v240-operator-ux.spec.js
            marker: V240_SNOOKER_PRICE_PERSISTENCE_OK
          - name: core-e2e
            spec: tools/client-v230-e2e.spec.js
            marker: V230_E2E_OK
          - name: click-matrix
            spec: tools/client-v230-click-matrix.spec.js
            marker: V230_CLICK_MATRIX_OK
          - name: persistence
            spec: tools/client-v230-persistence.spec.js
            marker: V230_OPERATIONAL_PERSISTENCE_OK
          - name: metier-journeys
            spec: tools/client-v240-game-journeys.spec.js
            marker: V240_METIER_FIRST_GAME_JOURNEYS_OK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare embedded media
        working-directory: v16-original-source
        run: bash tools/prepare-client-media-v230.sh
      - name: Validate JavaScript syntax
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/saas-entitlement-rbac-v240.js
          node --check app/src/main/assets/client-shell-next-v240.js
          node --check app/src/main/assets/client-operator-ux-v240.js
          node --check app/src/main/assets/client-saas-workspaces-v240.js
          node --check app/src/main/assets/p2-device-control-v240.js
          node --check "${{ matrix.spec }}"
      - name: Install browser runtime
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 4173 --directory app/src/main/assets >"../release-${{ matrix.name }}-server.log" 2>&1 &
          echo $! > "../release-${{ matrix.name }}-server.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Execute ${{ matrix.name }}
        working-directory: v16-original-source
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 10m env LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test "${{ matrix.spec }}" --reporter=line --workers=1 | tee "../release-${{ matrix.name }}.txt"
          grep -q "${{ matrix.marker }}" "../release-${{ matrix.name }}.txt"
      - name: Stop local app
        if: always()
        shell: bash
        run: |
          if [ -f "release-${{ matrix.name }}-server.pid" ]; then kill "$(cat "release-${{ matrix.name }}-server.pid")" 2>/dev/null || true; fi
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v240-release-${{ matrix.name }}-${{ github.run_number }}
          path: |
            release-${{ matrix.name }}.txt
            release-${{ matrix.name }}-server.log
            v16-original-source/test-results/
          if-no-files-found: warn
          retention-days: 14

  business-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Universal métier and session policy
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v230-policy-tests.js | tee ../release-policy.txt
          grep -q 'V230_SESSION_POLICY_TESTS_OK' ../release-policy.txt
          node tools/master-v2-domain-tests.js | tee ../release-domain.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../release-domain.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../release-domain.txt

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare media and validate SaaS security structure
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "2.4.0"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'saas-entitlement-rbac-v240.js' app/src/main/assets/index.html
          grep -q 'client-shell-next-v240.js' app/src/main/assets/index.html
          grep -q 'client-saas-workspaces-v240.js' app/src/main/assets/index.html
          grep -q 'client-session-semantic-guard-v240.js' app/src/main/assets/index.html
          test -s ../contracts/security/entitlement-prod-v1-public.der.b64
          test -f ../contracts/saas/module-catalog.v1.json
          test -f ../contracts/protocol/client-command-envelope.v2.schema.json
      - name: Compile and assemble Android deliverables
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac :tvagent:compileDebugJavaWithJavac
          gradle --no-daemon --stacktrace :app:assembleDebug :tvagent:assembleDebug :app:assembleRelease
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f tvagent/build/outputs/apk/debug/tvagent-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/mapping/release/mapping.txt
          echo V240_MANAGER_QA_APK_OK
          echo V240_TV_AGENT_QA_APK_OK
          echo V240_R8_RELEASE_BUILD_OK
      - name: Upload Android QA package
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-v2.4-QA-${{ github.run_number }}
          path: |
            v16-original-source/app/build/outputs/apk/debug/app-debug.apk
            v16-original-source/tvagent/build/outputs/apk/debug/tvagent-debug.apk
            v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk
            v16-original-source/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
