name: Build Signed LA PAUSE OS 2.6.0 Canonical SaaS

on:
  workflow_dispatch:
  push:
    branches: [android-canonical-ui-v260]
    paths:
      - "v16-original-source/app/src/main/assets/v260/**"
      - "v16-original-source/app/src/main/assets/v250/index.html"
      - "v16-original-source/app/src/main/assets/v250/saas-core.js"
      - "v16-original-source/app/src/main/assets/v250/media.js"
      - "v16-original-source/app/src/main/assets/media/**"
      - "v16-original-source/app/build.gradle.kts"
      - "v16-original-source/tools/test-v260-canonical-ui.js"
      - ".github/workflows/build-v260-canonical-signed.yml"

permissions:
  contents: read

jobs:
  signed-canonical-saas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Enforce canonical 01-44 SaaS contract
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/v250/saas-core.js
          node --check app/src/main/assets/v250/media.js
          for f in app/src/main/assets/v260/*.js; do node --check "$f"; done
          node tools/test-v260-canonical-ui.js
          grep -q 'android:name=".NewAppActivity"' app/src/main/AndroidManifest.xml
          ! grep -q 'PremiumActivity' app/src/main/AndroidManifest.xml
          grep -q '../v260/canonical.css' app/src/main/assets/v250/index.html
          grep -q '../v260/canonical-runtime.js' app/src/main/assets/v250/index.html
          ! grep -q 'screens-53-60.js' app/src/main/assets/v250/index.html
          ! grep -q 'app.css' app/src/main/assets/v250/index.html
          grep -q '@media (orientation:landscape)' app/src/main/assets/v260/canonical.css
          grep -q 'Mobile Operator App' app/src/main/assets/v260/board-10-screens-40-44.js
          grep -q 'Tablet Operator App' app/src/main/assets/v260/board-10-screens-40-44.js

      - name: Load pinned prod-v2 verifier
        shell: bash
        run: |
          set -euo pipefail
          PUB_FILE="contracts/security/entitlement-prod-v2-public.der.b64"
          test -s "$PUB_FILE"
          ENT_PUB="$(tr -d '\r\n ' < "$PUB_FILE")"
          ACTUAL="$(printf '%s' "$ENT_PUB" | base64 -d | sha256sum | awk '{print $1}')"
          test "$ACTUAL" = "12ef99e5353d1f172a8a5e69cb90f36df68fa81adaa89e52e827f3b8d1eab1a7"
          echo "LA_PAUSE_ENTITLEMENT_PUBLIC_KEY_B64=$ENT_PUB" >> "$GITHUB_ENV"
          echo "LA_PAUSE_ENTITLEMENT_KEY_ID=prod-v2" >> "$GITHUB_ENV"

      - name: Restore permanent Android signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"; test -n "$KS_PASS"; test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/cert.pem"
          ACTUAL="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f"
          echo OFFICIAL_ANDROID_SIGNER_OK

      - name: Build R8 release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/mapping/release/mapping.txt

      - name: Sign and verify 2.6.0 canonical SaaS
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/lp-v260-aligned.apk"
          OUT="LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SAAS-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee signed-v260-certificate.txt
          "$BT/aapt" dump badging "$OUT" | tee signed-v260-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-v260-badging.txt
          grep "versionCode='31'" signed-v260-badging.txt
          grep "versionName='2.6.0'" signed-v260-badging.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f' signed-v260-certificate.txt
          unzip -p "$OUT" assets/v250/index.html > signed-v260-index.html
          unzip -p "$OUT" assets/v260/canonical.css > signed-v260-canonical.css
          unzip -p "$OUT" assets/v260/canonical-ui-core.js > signed-v260-ui-core.js
          unzip -p "$OUT" assets/v260/canonical-runtime.js > signed-v260-runtime.js
          unzip -p "$OUT" assets/v260/board-10-screens-40-44.js > signed-v260-board10.js
          unzip -p "$OUT" assets/v250/saas-core.js > signed-v260-core.js
          grep -q '../v260/canonical-runtime.js' signed-v260-index.html
          ! grep -q 'screens-53-60.js' signed-v260-index.html
          ! grep -q 'app.css' signed-v260-index.html
          grep -q '@media (orientation:landscape)' signed-v260-canonical.css
          grep -q 'CanonicalUI' signed-v260-ui-core.js
          grep -q 'window.nativeBack' signed-v260-runtime.js
          grep -q 'Mobile Operator App' signed-v260-board10.js
          grep -q 'Tablet Operator App' signed-v260-board10.js
          grep -q 'M15_AI_OPERATOR' signed-v260-core.js
          grep -q 'acceptedActions' signed-v260-core.js
          grep -q 'assistedRevenue' signed-v260-core.js
          sha256sum "$OUT" | tee signed-v260-sha256.txt
          stat -c '%s bytes' "$OUT" | tee signed-v260-size.txt

      - name: Build verification manifest
        shell: bash
        run: |
          {
            echo 'LA PAUSE OS Android 2.6.0 — CANONICAL 44-SCREEN SAAS'
            echo "Commit: $GITHUB_SHA"
            echo 'Launcher: com.lapauseclub.manager.NewAppActivity'
            echo 'Visible frontend: CANONICAL 01-44 ONLY'
            echo 'Rejected v2.5 UI loaded: NO'
            echo 'Canonical boards: 01-05 / 06-10 / 11-14 / 15-19 / 20-23 / 24-27 / 28-31 / 32-35 / 36-39 / 40-44'
            echo 'Advanced legacy features: preserved inside canonical drawers/actions, not extra visible screens'
            echo 'SaaS: account + tenant + workspace + venue + branch + subscription + M01-M15 + RBAC + white-label + API'
            echo 'Responsive: phone portrait + phone landscape + tablet + RTL + rotation state restore'
            echo 'Operator: Duo 30 <=3 actions / per-game billiard / +30 / +1 game / snack / NBA / assisted revenue'
            echo 'Offline: local edge authority + autonomous/synchronized modes + outbox/inbox + conflicts + offline entitlement lease'
            cat signed-v260-sha256.txt
            cat signed-v260-size.txt
          } > LA-PAUSE-OS-v2.6.0-CANONICAL-SAAS-MANIFEST.txt

      - name: Upload signed canonical SaaS
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SAAS-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SAAS-SIGNED.apk
            LA-PAUSE-OS-v2.6.0-CANONICAL-SAAS-MANIFEST.txt
            signed-v260-certificate.txt
            signed-v260-badging.txt
            signed-v260-sha256.txt
            signed-v260-size.txt
            v16-original-source/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
