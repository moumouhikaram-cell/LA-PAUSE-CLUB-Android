name: LA PAUSE OS 2.4.0 Device Control CI

on:
  workflow_dispatch:
  push:
    branches:
      - android-device-control-v240
    paths:
      - "v16-original-source/**"
      - ".github/workflows/client-v240-device-control-ci.yml"

permissions:
  contents: read

jobs:
  device-control-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare embedded media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh

      - name: Device Control 2.4 structural contract
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          A=app/src/main/assets
          node --check "$A/p2-device-control-v240.js"
          node --check tools/client-v240-device-control.spec.js
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "2.4.0"' app/build.gradle.kts
          grep -q 'p2-device-control-v240.css' "$A/index.html"
          grep -q 'p2-device-control-v240.js' "$A/index.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          assert s.index('client-product-render-dispatch.js') < s.index('p2-device-control-v240.js') < s.index('client-product-boot.js')
          print('V240_RENDER_ORDER_OK')
          PY
          grep -q 'LA_PAUSE_DEVICE_AGENT_V1' "$A/p2-device-control-v240.js"
          grep -q 'discoverLaPauseAgents' app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q 'DEVICE_AGENT_PROTOCOL' app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q 'Executors.newFixedThreadPool(32)' app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q 'setConnectTimeout(350)' app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q 'p2QueueCommand' "$A/p2-device-control-v240.js"
          grep -q 'device.discovery.paired' "$A/p2-device-control-v240.js"
          grep -q 'V240_DISCOVERY_REQUIRES_OPERATOR_PAIR_OK' tools/client-v240-device-control.spec.js
          ! grep -qi 'adb shell' "$A/p2-device-control-v240.js"
          echo V240_DEVICE_CONTROL_STRUCTURE_OK

      - name: Compile Android 2.4 native bridge
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac
          echo V240_NATIVE_DISCOVERY_COMPILE_OK

      - name: Install browser test runtime
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory app/src/main/assets >../e2e-v240-server.log 2>&1 &
          echo $! > ../e2e-v240-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done

      - name: Device Control browser E2E first
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v240-device-control.spec.js --reporter=line --workers=1 | tee ../e2e-v240-device.txt
          grep -q 'V240_LAN_DISCOVERY_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_PAIRING_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_COMMAND_OK' ../e2e-v240-device.txt
          grep -q 'V240_HOME_DEVICE_PULSE_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_CONTROL_E2E_OK' ../e2e-v240-device.txt
          grep -q 'V240_DISCOVERY_REQUIRES_OPERATOR_PAIR_OK' ../e2e-v240-device.txt

      - name: Full v2.3 browser non-regression
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v230-e2e.spec.js tools/client-v230-click-matrix.spec.js tools/client-v230-persistence.spec.js tools/client-v230-game-journeys.spec.js --reporter=line --workers=1 | tee ../e2e-v240-regression.txt
          grep -q 'V230_ALL_GAME_JOURNEYS_OK' ../e2e-v240-regression.txt
          grep -q 'V230_OPERATIONAL_PERSISTENCE_OK' ../e2e-v240-regression.txt

      - name: Business regression gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v230-policy-tests.js | tee ../policy-v240.txt
          grep -q 'V230_SESSION_POLICY_TESTS_OK' ../policy-v240.txt
          node tools/master-v2-domain-tests.js | tee ../domain-v240.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-v240.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-v240.txt

      - name: Assemble Android 2.4 debug APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Stop local E2E server
        if: always()
        shell: bash
        run: |
          if [ -f e2e-v240-server.pid ]; then kill "$(cat e2e-v240-server.pid)" 2>/dev/null || true; fi

      - name: Upload v2.4 diagnostics and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v240-device-control-ci-${{ github.run_number }}
          path: |
            e2e-v240-device.txt
            e2e-v240-regression.txt
            e2e-v240-server.log
            policy-v240.txt
            domain-v240.txt
            v16-original-source/test-results/
            v16-original-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
