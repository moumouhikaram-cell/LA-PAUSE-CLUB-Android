name: LA PAUSE OS 2.4.0 SaaS + Device Control CI

on:
  workflow_dispatch:
  push:
    branches:
      - android-device-control-v240
    paths:
      - "v16-original-source/**"
      - "contracts/**"
      - "docs/DEVICE_AGENT_PROTOCOL_V1.md"
      - "docs/LA_PAUSE_SAAS_PLATFORM_BLUEPRINT_V1.md"
      - ".github/workflows/client-v240-device-control-ci.yml"

permissions:
  contents: read

jobs:
  saas-device-control-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare embedded media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh

      - name: SaaS, Device Control and security structural contract
        shell: bash
        run: |
          set -euxo pipefail
          A=v16-original-source/app/src/main/assets
          node --check "$A/p2-device-control-v240.js"
          node --check "$A/client-operator-ux-v240.js"
          node --check "$A/client-operator-ux-v240-hotfix.js"
          node --check "$A/saas-entitlement-rbac-v240.js"
          node --check v16-original-source/tools/client-v240-device-control.spec.js
          node --check v16-original-source/tools/client-v240-operator-ux.spec.js
          node --check v16-original-source/tools/saas-entitlement-rbac-v240.spec.js

          grep -q 'versionCode = 29' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "2.4.0"' v16-original-source/app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' v16-original-source/app/build.gradle.kts
          grep -q 'isShrinkResources = true' v16-original-source/app/build.gradle.kts
          grep -q 'ENTITLEMENT_PUBLIC_KEY_B64' v16-original-source/app/build.gradle.kts
          grep -q 'include(":app", ":tvagent")' v16-original-source/settings.gradle.kts
          grep -q 'android:allowBackup="false"' v16-original-source/app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="false"' v16-original-source/app/src/main/AndroidManifest.xml
          test -f v16-original-source/app/proguard-rules.pro
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/security/AppIntegrity.java
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/security/EntitlementVerifier.java
          grep -q 'OFFICIAL_SIGNER_SHA256' v16-original-source/app/src/main/java/com/lapauseclub/manager/security/AppIntegrity.java
          grep -q 'f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f' v16-original-source/app/src/main/java/com/lapauseclub/manager/security/AppIntegrity.java
          grep -q 'SHA256withECDSA' v16-original-source/app/src/main/java/com/lapauseclub/manager/security/EntitlementVerifier.java
          grep -q 'LP_CANONICAL_JSON_V1' v16-original-source/app/src/main/java/com/lapauseclub/manager/security/EntitlementVerifier.java
          grep -q 'getAppSecurityInfoJson' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'verifyEntitlementJson' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG)' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'setAllowUniversalAccessFromFileURLs(false)' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'HTTP clair interdit hors réseau local' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java

          test -f contracts/saas/module-catalog.v1.json
          test -f contracts/security/entitlement.v1.schema.json
          test -f contracts/protocol/client-command-envelope.v2.schema.json
          grep -q 'la-pause-module-catalog/1' contracts/saas/module-catalog.v1.json
          grep -q 'ECDSA_P256_SHA256' contracts/security/entitlement.v1.schema.json
          grep -q 'la-pause-client/2' contracts/protocol/client-command-envelope.v2.schema.json
          grep -q 'saas-entitlement-rbac-v240.js' "$A/index.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v16-original-source/app/src/main/assets/index.html').read_text()
          assert s.index('p5-platform.js') < s.index('saas-entitlement-rbac-v240.js') < s.index('master-v2-runtime.js')
          assert s.index('client-product-render-dispatch.js') < s.index('p2-device-control-v240.js') < s.index('client-operator-ux-v240.js') < s.index('client-product-boot.js')
          print('V240_SAAS_RUNTIME_ORDER_OK')
          PY
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          catalog=json.loads(Path('contracts/saas/module-catalog.v1.json').read_text())
          src=Path('v16-original-source/app/src/main/assets/saas-entitlement-rbac-v240.js').read_text()
          expected={'PLATFORM_CORE',*(m['id'] for m in catalog['modules'])}
          missing=[x for x in sorted(expected) if x not in src]
          assert not missing, missing
          print('V240_MODULE_CATALOG_RUNTIME_PARITY_OK')
          PY

          grep -q 'LA_PAUSE_DEVICE_AGENT_V1' "$A/p2-device-control-v240.js"
          grep -q 'discoverLaPauseAgents' v16-original-source/app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q 'supportedCommands' v16-original-source/app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          grep -q '/v1/pair' "$A/p2-device-control-v240.js"
          grep -q 'getSecureValue' "$A/p2-device-control-v240.js"
          grep -q 'BLOCKED_AUTH' "$A/p2-device-control-v240.js"
          grep -q 'media/ps5-available.png' "$A/client-operator-ux-v240.js"
          grep -q 'media/sim-vip.png' "$A/client-operator-ux-v240.js"

          test -f v16-original-source/tvagent/build.gradle.kts
          test -f v16-original-source/tvagent/src/main/java/com/lapauseclub/tvagent/AgentHttpServer.java
          grep -q 'LA_PAUSE_DEVICE_AGENT_V1' v16-original-source/tvagent/src/main/java/com/lapauseclub/tvagent/AgentConfig.java
          grep -q 'sha256(token)' v16-original-source/tvagent/src/main/java/com/lapauseclub/tvagent/AgentConfig.java
          grep -q 'idempotencyKey' v16-original-source/tvagent/src/main/java/com/lapauseclub/tvagent/AgentHttpServer.java
          echo V240_SAAS_SECURITY_STRUCTURE_OK
          echo V240_DEVICE_CONTROL_STRUCTURE_OK

      - name: Compile hardened manager and TV Agent
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac :tvagent:compileDebugJavaWithJavac
          echo V240_SAAS_SECURITY_NATIVE_COMPILE_OK
          echo V240_TV_AGENT_COMPILE_OK

      - name: Install browser test runtime
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory app/src/main/assets >../e2e-v240-server.log 2>&1 &
          echo $! > ../e2e-v240-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done

      - name: SaaS entitlement and RBAC E2E
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/saas-entitlement-rbac-v240.spec.js --reporter=line --workers=1 | tee ../e2e-v240-saas.txt
          grep -q 'SAAS_FORGED_ENTITLEMENT_REJECTED_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_SCOPE_ISOLATION_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_OFFLINE_EXPIRY_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_MODULE_DEPENDENCY_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_INTEGRITY_FAIL_CLOSED_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_RBAC_CASHIER_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_RBAC_BRANCH_SCOPE_OK' ../e2e-v240-saas.txt
          grep -q 'SAAS_ROUTE_MODULE_MAP_OK' ../e2e-v240-saas.txt

      - name: Device Control browser E2E
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v240-device-control.spec.js --reporter=line --workers=1 | tee ../e2e-v240-device.txt
          grep -q 'V240_LAN_DISCOVERY_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_PAIRING_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_COMMAND_OK' ../e2e-v240-device.txt
          grep -q 'V240_HOME_DEVICE_PULSE_OK' ../e2e-v240-device.txt
          grep -q 'V240_NO_TOKEN_IN_CLUB_STATE_OK' ../e2e-v240-device.txt
          grep -q 'V240_CAPABILITY_HONESTY_OK' ../e2e-v240-device.txt
          grep -q 'V240_SECURE_PAIRING_FAILS_CLOSED_OK' ../e2e-v240-device.txt
          grep -q 'V240_DEVICE_CONTROL_E2E_OK' ../e2e-v240-device.txt
          grep -q 'V240_DISCOVERY_REQUIRES_OPERATOR_PAIR_OK' ../e2e-v240-device.txt

      - name: Operator UX cumulative regression gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v240-operator-ux.spec.js --reporter=line --workers=1 | tee ../e2e-v240-operator-ux.txt
          grep -q 'V240_METIER_SEPARATION_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_DYNAMIC_IDLE_MEDIA_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_MARKETING_SURFACE_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_NO_FAKE_WALKIN_SELECT_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_DYNAMIC_GAME_MEDIA_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_NON_GAME_FAST_START_OK' ../e2e-v240-operator-ux.txt
          grep -q 'V240_SNOOKER_PRICE_PERSISTENCE_OK' ../e2e-v240-operator-ux.txt

      - name: Full v2.3 browser non-regression
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v230-e2e.spec.js tools/client-v230-click-matrix.spec.js tools/client-v230-persistence.spec.js tools/client-v230-game-journeys.spec.js --reporter=line --workers=1 | tee ../e2e-v240-regression.txt
          grep -q 'V230_ALL_GAME_JOURNEYS_OK' ../e2e-v240-regression.txt
          grep -q 'V230_OPERATIONAL_PERSISTENCE_OK' ../e2e-v240-regression.txt

      - name: Business regression gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v230-policy-tests.js | tee ../policy-v240.txt
          grep -q 'V230_SESSION_POLICY_TESTS_OK' ../policy-v240.txt
          node tools/master-v2-domain-tests.js | tee ../domain-v240.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-v240.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-v240.txt

      - name: Assemble debug apps and hardened release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :tvagent:assembleDebug :app:assembleRelease
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f tvagent/build/outputs/apk/debug/tvagent-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/mapping/release/mapping.txt
          echo V240_MANAGER_DEBUG_APK_OK
          echo V240_TV_AGENT_APK_OK
          echo V240_HARDENED_RELEASE_R8_OK

      - name: Stop local E2E server
        if: always()
        shell: bash
        run: |
          if [ -f e2e-v240-server.pid ]; then kill "$(cat e2e-v240-server.pid)" 2>/dev/null || true; fi

      - name: Upload v2.4 diagnostics and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v240-saas-device-control-ci-${{ github.run_number }}
          path: |
            e2e-v240-saas.txt
            e2e-v240-device.txt
            e2e-v240-operator-ux.txt
            e2e-v240-regression.txt
            e2e-v240-server.log
            policy-v240.txt
            domain-v240.txt
            v16-original-source/test-results/
            v16-original-source/app/build/outputs/apk/debug/app-debug.apk
            v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk
            v16-original-source/app/build/outputs/mapping/release/mapping.txt
            v16-original-source/tvagent/build/outputs/apk/debug/tvagent-debug.apk
          if-no-files-found: warn
          retention-days: 14
