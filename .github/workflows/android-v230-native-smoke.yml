name: LA PAUSE OS 2.3.0 Android Native Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - "v16-original-source/**"
      - ".github/workflows/android-v230-native-smoke.yml"

permissions:
  contents: read

jobs:
  android-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare offline media and build debug APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            APK="v16-original-source/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.lapauseclub.manager
            adb shell am start -W -n com.lapauseclub.manager/.PremiumActivity | tee android-launch.txt
            sleep 6
            PID="$(adb shell pidof com.lapauseclub.manager | tr -d '\r')"
            test -n "$PID"
            echo "ANDROID_LAUNCH_OK" | tee android-native-smoke.txt

            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell uiautomator dump /sdcard/lp-window.xml >/dev/null
            adb pull /sdcard/lp-window.xml android-window-back.xml >/dev/null
            grep -q "Voulez-vous vraiment fermer" android-window-back.xml
            grep -q "LA PAUSE OS" android-window-back.xml
            echo "ANDROID_HOME_EXIT_DIALOG_OK" | tee -a android-native-smoke.txt
            adb shell input keyevent KEYCODE_BACK
            sleep 1

            PID_BEFORE="$(adb shell pidof com.lapauseclub.manager | tr -d '\r')"
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 3
            PID_LAND="$(adb shell pidof com.lapauseclub.manager | tr -d '\r')"
            test "$PID_BEFORE" = "$PID_LAND"
            adb shell settings put system user_rotation 0
            sleep 3
            PID_AFTER="$(adb shell pidof com.lapauseclub.manager | tr -d '\r')"
            test "$PID_BEFORE" = "$PID_AFTER"
            adb shell uiautomator dump /sdcard/lp-window-portrait.xml >/dev/null
            adb pull /sdcard/lp-window-portrait.xml android-window-portrait.xml >/dev/null
            grep -q "LA PAUSE OS" android-window-portrait.xml
            echo "ANDROID_ROTATION_OK" | tee -a android-native-smoke.txt

            adb logcat -d --pid="$PID_AFTER" > android-logcat.txt || adb logcat -d > android-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\.lapauseclub\.manager.*has died" android-logcat.txt; then
              echo "Fatal Android runtime error detected" >&2
              exit 1
            fi
            echo "ANDROID_LOGCAT_OK" | tee -a android-native-smoke.txt
            echo "ANDROID_NATIVE_SMOKE_OK" | tee -a android-native-smoke.txt

      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v230-android-native-smoke-${{ github.run_number }}
          path: |
            android-native-smoke.txt
            android-launch.txt
            android-window-back.xml
            android-window-portrait.xml
            android-logcat.txt
          if-no-files-found: warn
          retention-days: 7
