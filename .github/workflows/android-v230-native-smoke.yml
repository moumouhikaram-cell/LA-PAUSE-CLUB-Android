name: LA PAUSE OS 2.3.0 Android Native Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - "v16-original-source/**"
      - ".github/workflows/android-v230-native-smoke.yml"

permissions:
  contents: read

jobs:
  android-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare offline media and build debug APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash v16-original-source/tools/android-native-smoke-v230.sh

      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v230-android-native-smoke-${{ github.run_number }}
          path: |
            android-native-smoke.txt
            android-native-trace.txt
            android-launch.txt
            android-focus.txt
            android-focus-back.txt
            android-window-back.xml
            android-window-portrait.xml
            android-logcat.txt
          if-no-files-found: warn
          retention-days: 7
