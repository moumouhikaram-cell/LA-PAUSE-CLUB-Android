name: Android v1.6 Stabilization Native Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - android-v160-stabilization
    paths:
      - "v16-original-source/app/src/main/**"
      - "v16-original-source/tools/android-v160-launch-smoke.sh"
      - "v16-original-source/tools/android-v160-real-user-journey.sh"
      - "v16-original-source/tools/android-v160-navigation-matrix.sh"
      - "v16-original-source/tools/cdp-v160-stabilization-probe.js"
      - "v16-original-source/tools/cdp-v160-raw-websocket.js"
      - "v16-original-source/tools/test-v160-*.js"
      - ".github/workflows/android-v160-stabilization-native-smoke.yml"

permissions:
  contents: read

jobs:
  native-stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Existing-product regression gates
        shell: bash
        run: |
          set -euxo pipefail
          node --check v16-original-source/app/src/main/assets/stabilize-v160-existing.js
          node --check v16-original-source/app/src/main/assets/stabilize-v160-shift-recovery.js
          node --check v16-original-source/app/src/main/assets/stabilize-v160-navigation.js
          node --check v16-original-source/app/src/main/assets/enrich-v160-operator-shortcuts.js
          node --check v16-original-source/app/src/main/assets/enrich-v160-device-control.js
          node --check v16-original-source/tools/cdp-v160-stabilization-probe.js
          grep -q "DIRECT_MODE=process.env.LP160_CDP_DIRECT==='1'" v16-original-source/tools/cdp-v160-stabilization-probe.js
          grep -q 'text_control=tag in' v16-original-source/tools/android-v160-real-user-journey.sh
          bash -n v16-original-source/tools/android-v160-launch-smoke.sh
          bash -n v16-original-source/tools/android-v160-real-user-journey.sh
          bash -n v16-original-source/tools/android-v160-navigation-matrix.sh
          node v16-original-source/tools/test-v160-design-frozen.js
          node v16-original-source/tools/test-v160-stabilization-navigation.js
          node v16-original-source/tools/test-v160-native-back-contract.js
          node v16-original-source/tools/test-v160-stabilization-routes.js
          node v16-original-source/tools/test-v160-stabilization-interactions.js
          node v16-original-source/tools/test-v160-stabilization-shift-session.js
          node v16-original-source/tools/test-v160-auto-operational-shift.js
          node v16-original-source/tools/test-v160-operator-shortcuts.js
          node v16-original-source/tools/test-v160-anonymous-client.js
          node v16-original-source/tools/test-v160-pricing-persistence.js
          node v16-original-source/tools/test-v160-active-cockpit.js
          node v16-original-source/tools/test-v160-session-snacks.js
          node v16-original-source/tools/test-v160-stabilization-cash-dom.js
          node v16-original-source/tools/test-v160-stabilization-accounting.js
          node v16-original-source/tools/test-v160-stabilization-prepaid-sales.js
          node v16-original-source/tools/test-v160-stabilization-booking-refund.js
          node v16-original-source/tools/test-v160-stabilization-raw-cdp-socket.js
          node v16-original-source/tools/test-v160-stabilization-native-runtime-recovery.js
          node v16-original-source/tools/test-v160-device-control.js
          node v16-original-source/tools/test-v160-device-lan-native.js

      - name: Park unrelated modern modules and build exact v1.6
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="v16-original-source/app/src/main/java/com/lapauseclub/manager"
          PARK_JAVA="$RUNNER_TEMP/parked-modern-java"; mkdir -p "$PARK_JAVA"
          while IFS= read -r -d '' src; do
            rel="${src#$ROOT/}"
            case "$rel" in
              MainActivity.java|DeviceLanBridge.java|BootReceiver.java|SessionAlarmReceiver.java|core/CoreStore.java) ;;
              *) mkdir -p "$PARK_JAVA/$(dirname "$rel")"; mv "$src" "$PARK_JAVA/$rel" ;;
            esac
          done < <(find "$ROOT" -type f -name '*.java' -print0)
          test "$(find "$ROOT" -type f -name '*.java' | wc -l)" -eq 5

          ASSETS="v16-original-source/app/src/main/assets"
          PARK_ASSETS="$RUNNER_TEMP/parked-modern-assets"; mkdir -p "$PARK_ASSETS"
          while IFS= read -r -d '' src; do
            rel="${src#$ASSETS/}"
            case "$rel" in
              app.css|app.js|index.html|logo.svg|v13.css|v13.js|v14.css|v14.js|v15.css|v15.js|stabilize-v160-existing.js|stabilize-v160-shift-recovery.js|stabilize-v160-navigation.js|enrich-v160-*.js|\
              media/combat-dynamic.png|media/combat.svg|media/esport-dynamic.png|media/esport-team.jpg|media/esport.svg|\
              media/football-dynamic.png|media/football.svg|media/idle.svg|\
              media/products/chips.svg|media/products/chocolate.svg|media/products/cocacola.jpg|media/products/coffee.svg|media/products/cola.svg|media/products/energy.svg|media/products/fanta.jpg|media/products/lays.jpg|media/products/oreo.jpg|media/products/redbull.jpg|media/products/snickers.jpg|media/products/sprite.jpg|media/products/twix.jpg|media/products/water.svg|\
              media/ps5-available.png|media/ps5-default.jpg|media/racing-dynamic.png|media/racing.svg|media/sim-racing.jpg|media/sim-vip.png|media/sim.svg|media/tactical-dynamic.png|media/tactical.jpg|media/tactical.svg) ;;
              *) mkdir -p "$PARK_ASSETS/$(dirname "$rel")"; mv "$src" "$PARK_ASSETS/$rel" ;;
            esac
          done < <(find "$ASSETS" -type f -print0)
          ! find "$ASSETS" -type f | grep -q '/v250/'
          ! find "$ASSETS" -type f | grep -qi 'saas'
          ! find "$ASSETS" -type f | grep -qi 'onboarding'

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          assets = Path("v16-original-source/app/src/main/assets")
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.srcs=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="script":
                      src=dict(attrs).get("src")
                      if src:self.srcs.append(src)
          p=Scripts();p.feed((assets/"index.html").read_text(encoding="utf-8"))
          local=[s.split("?",1)[0].split("#",1)[0] for s in p.srcs if "://" not in s and not s.startswith("//")]
          missing=[s for s in local if not (assets/s).is_file()]
          if missing: raise SystemExit(f"index.html references missing local scripts before build: {missing}")
          print("INDEX_LOCAL_SCRIPTS_OK",len(local))
          PY

          cd v16-original-source
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          from html.parser import HTMLParser
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as zf:
              names=set(zf.namelist()); html=zf.read("assets/index.html").decode("utf-8")
              class Scripts(HTMLParser):
                  def __init__(self): super().__init__(); self.srcs=[]
                  def handle_starttag(self,tag,attrs):
                      if tag.lower()=="script":
                          src=dict(attrs).get("src")
                          if src:self.srcs.append(src)
              p=Scripts();p.feed(html)
              local=[s.split("?",1)[0].split("#",1)[0] for s in p.srcs if "://" not in s and not s.startswith("//")]
              missing=[s for s in local if "assets/"+s not in names]
              if missing: raise SystemExit(f"APK index.html references scripts absent from package: {missing}")
              required={"assets/stabilize-v160-existing.js","assets/stabilize-v160-shift-recovery.js","assets/stabilize-v160-navigation.js","assets/enrich-v160-operator-shortcuts.js","assets/enrich-v160-device-control.js"}
              absent=sorted(required-names)
              if absent: raise SystemExit(f"APK missing stabilization runtime: {absent}")
              print("APK_INDEX_SCRIPT_INTEGRITY_OK",len(local))
          PY
          TMP_DEX="$(mktemp -d)"
          unzip -q "$APK" 'classes*.dex' -d "$TMP_DEX"
          strings "$TMP_DEX"/classes*.dex | grep -q 'DeviceLanBridge'
          echo V160_DEVICE_LAN_BRIDGE_PACKAGED_API33_OK

      - name: Physical Android 13 compatibility + real user journey + full navigation matrix
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LP160_CDP_DIRECT: "1"
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          emulator-build: 11237101
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash v16-original-source/tools/android-v160-launch-smoke.sh
            bash v16-original-source/tools/android-v160-real-user-journey.sh
            bash v16-original-source/tools/android-v160-navigation-matrix.sh

      - name: Upload stabilization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v160-stabilization-native-${{ github.run_number }}
          path: |
            android-v160-launch-smoke-trace.txt
            android-v160-real-user-journey-trace.txt
            android-v160-real-user-journey-logcat.txt
            android-v160-navigation-matrix-trace.txt
            android-v160-navigation-matrix-logcat.txt
          if-no-files-found: warn
          retention-days: 14
