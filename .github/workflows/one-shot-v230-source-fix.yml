name: One-shot v2.3 QA source repair

on:
  push:
    branches:
      - android-client-final-v230
    paths:
      - ".github/workflows/one-shot-v230-source-fix.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-client-final-v230
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          v15 = Path('v16-original-source/app/src/main/assets/v15.js')
          s = v15.read_text()
          old = "function bookingStartMsV15(b){return b.startAt||fromIsoV15(b.startsAt)}\nfunction bookingEndMsV15(b){return b.endAt||fromIsoV15(b.endsAt)}"
          new = "function bookingStartMsV15(b){if(!b)return 0;return b.startAt||fromIsoV15(b.startsAt)}\nfunction bookingEndMsV15(b){if(!b)return 0;return b.endAt||fromIsoV15(b.endsAt)}"
          if old not in s:
              raise SystemExit('v15 booking target not found')
          s = s.replace(old, new, 1)
          v15.write_text(s)

          app = Path('v16-original-source/app/src/main/assets/app.js')
          s = app.read_text()
          old_start = "const bindSettingsV11Fallback = (function(){\n  /* copy of non-station bindings, kept separate so v1.2 can own station media */\n  return function(section){"
          new_start = "function bindSettingsV11Fallback(section){\n  /* copy of non-station bindings, kept separate so v1.2 can own station media */"
          if old_start not in s:
              raise SystemExit('app settings fallback start target not found')
          s = s.replace(old_start, new_start, 1)
          old_end = "\n  }\n})();\n\nfunction renderTvStations(){"
          new_end = "\n}\n\nfunction renderTvStations(){"
          if old_end not in s:
              raise SystemExit('app settings fallback end target not found')
          s = s.replace(old_end, new_end, 1)
          app.write_text(s)
          PY
          node --check v16-original-source/app/src/main/assets/app.js
          node --check v16-original-source/app/src/main/assets/v15.js
          git diff --check
          git diff -- v16-original-source/app/src/main/assets/app.js v16-original-source/app/src/main/assets/v15.js
      - name: Commit repairs to canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LA PAUSE OS QA"
          git config user.email "actions@users.noreply.github.com"
          git add v16-original-source/app/src/main/assets/app.js v16-original-source/app/src/main/assets/v15.js
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m "fix(v230): repair reservations and settings runtime crashes"
          git push origin HEAD:android-client-final-v230
