name: Build LA PAUSE CLUB v1.6 Core Mirror

on:
  workflow_dispatch:
  push:
    branches:
      - android-v16-original-integration
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-v16-original.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Static compatibility checks
        shell: bash
        run: |
          set -euxo pipefail

          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q 'package com.lapauseclub.manager;' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'CoreStore' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'coreStore.mirrorLegacyState' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'recoverLatestValidStateJson' v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'versionCode = 19' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' v16-original-source/app/build.gradle.kts

          node --check v16-original-source/app/src/main/assets/app.js
          node --check v16-original-source/app/src/main/assets/v13.js
          node --check v16-original-source/app/src/main/assets/v14.js
          node --check v16-original-source/app/src/main/assets/v15.js

          # Preserve original LA PAUSE business logic/features.
          grep -q 'ps5Solo:22' v16-original-source/app/src/main/assets/app.js
          grep -q 'ps5Duo:28' v16-original-source/app/src/main/assets/app.js
          grep -q 'sim:45' v16-original-source/app/src/main/assets/app.js
          grep -q "defaultPaymentTiming:'start'" v16-original-source/app/src/main/assets/app.js
          grep -q 'Pass &amp; abonnements' v16-original-source/app/src/main/assets/index.html
          grep -q 'Roi de la PS5' v16-original-source/app/src/main/assets/index.html
          grep -q 'Pause Points' v16-original-source/app/src/main/assets/index.html
          grep -q 'Manettes &amp; accessoires' v16-original-source/app/src/main/assets/index.html
          grep -q 'Clients &amp; rétention' v16-original-source/app/src/main/assets/index.html
          grep -q 'Données &amp; sauvegardes' v16-original-source/app/src/main/assets/index.html

          # Core migration invariants.
          grep -q 'legacyStillAuthoritative.*true' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q '"migration_mode", "MIRROR"' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q '"operating_mode", "STANDALONE"' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q 'networkRequired", false' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java

      - name: Build original-package v1.6 APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="v16-original-source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee v16-badging.txt

          grep "package: name='com.lapauseclub.manager'" v16-badging.txt
          grep "versionCode='19'" v16-badging.txt
          grep "versionName='1.6.0'" v16-badging.txt
          grep "targetSdkVersion:'36'" v16-badging.txt

          unzip -l "$APK" | grep 'assets/v15.js'
          unzip -l "$APK" | grep 'assets/media/ps5-available.png'
          unzip -l "$APK" | grep 'assets/media/sim-vip.png'
          unzip -l "$APK" | grep 'assets/media/products/redbull.jpg'

          cp "$APK" "LA-PAUSE-CLUB-Manager-v1.6.0-core-mirror-debug.apk"
          sha256sum "LA-PAUSE-CLUB-Manager-v1.6.0-core-mirror-debug.apk"

      - name: Upload v1.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.6.0-core-mirror-debug
          path: LA-PAUSE-CLUB-Manager-v1.6.0-core-mirror-debug.apk
          if-no-files-found: error
          retention-days: 30
