name: Build Signed LA PAUSE OS Android v1.7

on:
  workflow_dispatch:
  push:
    branches:
      - android-v17-la-pause-os
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-v17-signed.yml"

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Restore permanent signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
      - name: Preserve LA PAUSE OS invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'applicationId = "com.lapauseclub.manager"' v16-original-source/app/build.gradle.kts
          grep -q 'versionCode = 21' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "1.7.1-alpha2"' v16-original-source/app/build.gradle.kts
          grep -q 'DB_VERSION = 2' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q 'CoreDomainSchemaV2.dualWrite' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java
          grep -q 'CREATE TABLE IF NOT EXISTS venue_profile' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreDomainSchemaV2.java
          grep -q 'CREATE TABLE IF NOT EXISTS resources' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreDomainSchemaV2.java
          grep -q 'SQLITE_DUAL_WRITE' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreDomainSchemaV2.java
          grep -q 'PARITY_PROVING' v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreDomainSchemaV2.java
          grep -q 'ps5Solo:22' v16-original-source/app/src/main/assets/app.js
          grep -q 'ps5Duo:28' v16-original-source/app/src/main/assets/app.js
          grep -q 'sim:45' v16-original-source/app/src/main/assets/app.js
          grep -q "V17_APP_VERSION='1.7.0-alpha1'" v16-original-source/app/src/main/assets/v17.js
          grep -q "V171_APP_VERSION='1.7.1-alpha2'" v16-original-source/app/src/main/assets/v171.js
          grep -q 'v171.js' v16-original-source/app/src/main/assets/index.html
          node --check v16-original-source/app/src/main/assets/v17.js
          node --check v16-original-source/app/src/main/assets/v171.js
      - name: Build release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$RUNNER_TEMP/la-pause-aligned.apk"
          S="LA-PAUSE-OS-Android-v1.7.1-alpha2-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$S" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='21'" signed-badging.txt
          grep "versionName='1.7.1-alpha2'" signed-badging.txt
          sha256sum "$S" | tee signed-sha256.txt
      - name: Cleanup key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v1.7.1-alpha2-SIGNED
          path: |
            LA-PAUSE-OS-Android-v1.7.1-alpha2-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-sha256.txt
          if-no-files-found: error
          retention-days: 30
