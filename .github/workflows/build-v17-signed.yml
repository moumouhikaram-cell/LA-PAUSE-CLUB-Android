name: Build Signed LA PAUSE OS Monster 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - android-v17-la-pause-os
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-v17-signed.yml"

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Restore permanent signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
      - name: Monster CDC invariants
        shell: bash
        run: |
          set -euxo pipefail
          A=v16-original-source/app/src/main/assets
          C=v16-original-source/app/src/main/java/com/lapauseclub/manager/core
          grep -q 'applicationId = "com.lapauseclub.manager"' v16-original-source/app/build.gradle.kts
          grep -q 'versionCode = 23' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta1"' v16-original-source/app/build.gradle.kts
          grep -q 'DB_VERSION=8' "$C/CoreStore.java"
          grep -q 'CoreSyncSchemaV8' "$C/CoreStore.java"
          grep -q 'CoreOperationalSchemaP1' "$C/CoreStore.java"
          grep -q 'CoreBusinessSchemaP1' "$C/CoreStore.java"
          grep -q 'CoreDeviceSchemaP2' "$C/CoreStore.java"
          grep -q 'CoreOwnerSchemaP3' "$C/CoreStore.java"
          grep -q 'CorePlayerSchemaP4' "$C/CoreStore.java"
          grep -q 'CoreSaasSchemaP5' "$C/CoreStore.java"
          grep -q 'networkRequired",false' "$C/CoreStore.java"
          grep -q 'ps5Solo:22' "$A/app.js"
          grep -q 'ps5Duo:28' "$A/app.js"
          grep -q 'sim:45' "$A/app.js"
          grep -q "defaultPaymentTiming:'start'" "$A/app.js"
          for f in app.js v13.js v14.js v15.js v17.js v171.js v172.js p1-core.js p1-floor.js p1-ops.js p1-finance.js p1-commerce.js p2-device.js p2-fleet.js p3-owner.js p3-intelligence.js p4-player.js p4-experience-v2.js p5-saas.js p5-web-contract.js p5-platform.js monster-release.js; do
            test -f "$A/$f"
            node --check "$A/$f"
          done
          grep -q 'p5-web-contract.js' "$A/index.html"
          grep -q 'CommandEnvelope' docs/android/WEB_ANDROID_PARITY_CONTRACT_V1.md
          grep -q 'command_outbox_v8' "$C/CoreSyncSchemaV8.java"
          grep -q 'BILLIARD_TABLE' "$A/p1-core.js"
          grep -q 'p1PartialRefund' "$A/p1-finance.js"
          grep -q 'p1CompleteStockCount' "$A/p1-commerce.js"
          grep -q 'p2QueueCommand' "$A/p2-device.js"
          grep -q 'p3VenueHealth' "$A/p3-owner.js"
          grep -q 'p3InventoryBrain' "$A/p3-intelligence.js"
          grep -q 'p4PlayerDna' "$A/p4-player.js"
          grep -q 'p4CreateCampaign' "$A/p4-experience-v2.js"
          grep -q 'p5Handshake' "$A/p5-saas.js"
          grep -q 'wpQueueCommand' "$A/p5-web-contract.js"
          grep -q 'p5SupportBundle' "$A/p5-platform.js"
      - name: Build release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign and verify APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$RUNNER_TEMP/la-pause-aligned.apk"
          S="LA-PAUSE-OS-Android-v2.0.0-beta1-MONSTER-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$S" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='23'" signed-badging.txt
          grep "versionName='2.0.0-beta1'" signed-badging.txt
          sha256sum "$S" | tee signed-sha256.txt
      - name: Cleanup key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.0.0-beta1-MONSTER-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.0.0-beta1-MONSTER-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-sha256.txt
          if-no-files-found: error
          retention-days: 30
