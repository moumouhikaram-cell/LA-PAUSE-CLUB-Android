name: Build Signed LA PAUSE OS Client Final 2.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - android-p1-monster-dev
    paths:
      - ".github/workflows/build-v17-signed.yml"

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare premium HD offline media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media.sh

      - name: Restore permanent LA PAUSE signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Customer final release gates
        shell: bash
        run: |
          set -euxo pipefail
          A=v16-original-source/app/src/main/assets
          J=v16-original-source/app/src/main/java/com/lapauseclub/manager
          P="$A/media/premium"
          grep -q 'applicationId = "com.lapauseclub.manager"' v16-original-source/app/build.gradle.kts
          grep -q 'versionCode = 26' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "2.1.1-beta1"' v16-original-source/app/build.gradle.kts
          grep -q 'android:name=".PremiumActivity"' v16-original-source/app/src/main/AndroidManifest.xml
          grep -q 'android:label="LA PAUSE OS"' v16-original-source/app/src/main/AndroidManifest.xml
          grep -q 'window.nativeBack ? window.nativeBack() : false' "$J/PremiumActivity.java"
          grep -q 'Quitter LA PAUSE OS ?' "$J/PremiumActivity.java"
          grep -q 'WindowInsets.Type.systemBars' "$J/PremiumActivity.java"
          grep -q 'safe-area-inset-bottom' "$A/client-final.css"
          grep -q 'clientNativeBack' "$A/client-final.js"
          grep -q 'client-hardening.js' "$A/master-v2-welcome.js"
          grep -q 'client-persistent-dock.js' "$A/master-v2-welcome.js"
          grep -q 'client-final.js' "$A/master-v2-welcome.js"
          grep -q 'BILLIARD_TABLE' "$A/p1-core.js"
          grep -q 'SNOOKER_TABLE' "$A/p1-core.js"
          grep -q 'PC_GAMING' "$A/p1-core.js"
          grep -q 'SESSION.REQUEST' "$A/master-v2-runtime.js"
          grep -q 'SESSION.PAY' "$A/master-v2-runtime.js"
          grep -q 'SESSION.START' "$A/master-v2-runtime.js"
          grep -q 'ps5Solo:22' "$A/app.js"
          grep -q 'ps5Duo:28' "$A/app.js"
          grep -q 'sim:45' "$A/app.js"
          grep -q "defaultPaymentTiming:'start'" "$A/app.js"
          ! grep -q 'MASTER V2' "$A/index.html"
          ! grep -q 'EDGE + CLOUD' "$A/index.html"
          ! grep -q 'System Status' "$A/index.html"
          ! grep -q 'monster-os.js' "$A/index.html"
          ! grep -q 'monster-release.js' "$A/index.html"
          test $(stat -c%s "$P/billiard.jpg") -gt 100000
          test $(stat -c%s "$P/snooker.jpg") -gt 100000
          test $(stat -c%s "$P/lounge.jpg") -gt 100000
          for f in client-hardening.js client-persistent-dock.js client-final.js master-v2-welcome.js venue-experience.js p1-core.js master-v2-runtime.js master-v2-safety.js; do node --check "$A/$f"; done

      - name: Universal business regression tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/master-v2-domain-tests.js | tee ../client-domain-tests.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../client-domain-tests.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../client-domain-tests.txt
          node tools/universal-resource-client-tests.js | tee ../universal-resource-tests.txt
          grep -q 'UNIVERSAL_RESOURCE_CLIENT_TESTS_OK' ../universal-resource-tests.txt

      - name: Sellable feature operability audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-operability-audit.js | tee ../client-operability-audit.txt
          grep -q 'CLIENT_OPERABILITY_AUDIT_OK' ../client-operability-audit.txt
          grep -q 'MENU_TARGETS_OK' ../client-operability-audit.txt

      - name: Build release APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify client APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/la-pause-client-final-aligned.apk"
          SIGNED="LA-PAUSE-OS-Android-v2.1.1-beta1-CLIENT-FINAL-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$SIGNED" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='26'" signed-badging.txt
          grep "versionName='2.1.1-beta1'" signed-badging.txt
          grep -qi 'Signer #1 certificate DN: CN=LA PAUSE OS' signed-certificate.txt
          unzip -l "$SIGNED" | tee signed-assets.txt
          grep -q 'assets/client-hardening.js' signed-assets.txt
          grep -q 'assets/client-persistent-dock.js' signed-assets.txt
          grep -q 'assets/client-final.js' signed-assets.txt
          grep -q 'assets/client-final.css' signed-assets.txt
          grep -q 'assets/media/premium/billiard.jpg' signed-assets.txt
          grep -q 'assets/media/premium/snooker.jpg' signed-assets.txt
          grep -q 'assets/media/premium/lounge.jpg' signed-assets.txt
          unzip -p "$SIGNED" assets/media/premium/billiard.jpg | wc -c | awk '$1 > 100000'
          unzip -p "$SIGNED" assets/media/premium/snooker.jpg | wc -c | awk '$1 > 100000'
          unzip -p "$SIGNED" assets/media/premium/lounge.jpg | wc -c | awk '$1 > 100000'
          sha256sum "$SIGNED" | tee signed-sha256.txt
          stat -c '%s bytes' "$SIGNED" | tee signed-size.txt

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-client-final-aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.1.1-beta1-CLIENT-FINAL-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.1.1-beta1-CLIENT-FINAL-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-assets.txt
            signed-sha256.txt
            signed-size.txt
            client-domain-tests.txt
            universal-resource-tests.txt
            client-operability-audit.txt
          if-no-files-found: error
          retention-days: 30
