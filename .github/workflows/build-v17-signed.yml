name: Build Signed LA PAUSE OS Master V2 beta2

on:
  workflow_dispatch:
  push:
    branches:
      - android-p1-monster-dev
    paths:
      - ".github/workflows/build-v17-signed.yml"

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Restore permanent LA PAUSE signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
      - name: Master V2 release invariants
        shell: bash
        run: |
          set -euxo pipefail
          A=v16-original-source/app/src/main/assets
          J=v16-original-source/app/src/main/java
          C="$J/com/lapauseclub/manager/core"
          grep -q 'applicationId = "com.lapauseclub.manager"' v16-original-source/app/build.gradle.kts
          grep -q 'versionCode = 24' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta2"' v16-original-source/app/build.gradle.kts
          grep -q 'DB_VERSION=9' "$C/CoreStore.java"
          grep -q 'CoreCommandSchemaV9' "$C/CoreStore.java"
          grep -q 'commitCommand' "$C/CoreStore.java"
          grep -q 'command_log_v9' "$C/CoreCommandSchemaV9.java"
          grep -q 'entity_revisions_v9' "$C/CoreCommandSchemaV9.java"
          grep -q 'domain_events_v9' "$C/CoreCommandSchemaV9.java"
          grep -q 'outbox_events_v9' "$C/CoreCommandSchemaV9.java"
          grep -q 'audit_events_v9' "$C/CoreCommandSchemaV9.java"
          grep -q 'command_outbox_v8' "$C/CoreSyncSchemaV8.java"
          grep -q 'sync_inbox_v8' "$C/CoreSyncSchemaV8.java"
          grep -q 'tombstones_v8' "$C/CoreSyncSchemaV8.java"
          grep -q 'consent_evidence_v8' "$C/CoreSyncSchemaV8.java"
          grep -q 'AndroidKeyStore' "$J/com/lapauseclub/manager/security/SecureStore.java"
          grep -q 'commitCoreCommand' "$J/com/lapauseclub/manager/MainActivity.java"
          grep -q 'ps5Solo:22' "$A/app.js"
          grep -q 'ps5Duo:28' "$A/app.js"
          grep -q 'sim:45' "$A/app.js"
          grep -q "defaultPaymentTiming:'start'" "$A/app.js"
          grep -q 'SESSION.REQUEST' "$A/master-v2-runtime.js"
          grep -q 'SESSION.PAY' "$A/master-v2-runtime.js"
          grep -q 'SESSION.START' "$A/master-v2-runtime.js"
          grep -q 'QUEUE.CALL' "$A/master-v2-runtime.js"
          grep -q 'REFUND.PARTIAL' "$A/master-v2-runtime.js"
          grep -q 'Montant supérieur au solde remboursable' "$A/master-v2-safety.js"
          grep -q 'master-v2-runtime.js' "$A/index.html"
          grep -q 'master-v2-safety.js' "$A/index.html"
          grep -q 'master-v2-welcome.js' "$A/index.html"
          grep -q 'p5-web-contract.js' "$A/index.html"
          grep -q "MONSTER_RELEASE='2.0.0-beta2'" "$A/monster-release.js"
          grep -q 'CommandEnvelope' docs/android/WEB_ANDROID_PARITY_CONTRACT_V1.md
          for f in app.js v13.js v14.js v15.js v17.js v171.js v172.js p1-core.js p1-floor.js p1-ops.js p1-finance.js p1-commerce.js p2-device.js p2-fleet.js p3-owner.js p3-intelligence.js p4-player.js p4-experience-v2.js p5-saas.js p5-web-contract.js p5-platform.js monster-release.js master-v2-runtime.js master-v2-safety.js master-v2-welcome.js; do
            test -f "$A/$f"
            node --check "$A/$f"
          done
      - name: Master V2 domain regression tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/master-v2-domain-tests.js | tee ../master-v2-domain-tests.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../master-v2-domain-tests.txt
      - name: Build release APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign and verify permanent-key APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/la-pause-master-v2-aligned.apk"
          SIGNED="LA-PAUSE-OS-Android-v2.0.0-beta2-MASTER-V2-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$SIGNED" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='24'" signed-badging.txt
          grep "versionName='2.0.0-beta2'" signed-badging.txt
          grep -qi 'Signer #1 certificate DN: CN=LA PAUSE OS' signed-certificate.txt
          sha256sum "$SIGNED" | tee signed-sha256.txt
          stat -c '%s bytes' "$SIGNED" | tee signed-size.txt
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-master-v2-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.0.0-beta2-MASTER-V2-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.0.0-beta2-MASTER-V2-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-sha256.txt
            signed-size.txt
            master-v2-domain-tests.txt
          if-no-files-found: error
          retention-days: 30
