name: Build LA PAUSE CLUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euxo pipefail
          ZIP=".github/workflows/LA_PAUSE_CLUB_Android_GitHubReady.zip"
          test -f "$ZIP"
          rm -rf project
          mkdir -p project
          unzip -o "$ZIP" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Android project extracted successfully"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | head -30
          cp "$APK" "LA-PAUSE-CLUB-Manager-v1.1.1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.1.1-debug
          path: LA-PAUSE-CLUB-Manager-v1.1.1-debug.apk
          if-no-files-found: error
          retention-days: 30
