name: Build LA PAUSE CLUB APK v1.5.0 PARITY

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild v1.5.0 parity project
        shell: bash
        run: |
          set -euxo pipefail

          BASE="LA_PAUSE_CLUB_Android_GitHubReady_v1.3.2.b64.txt"
          V14="LA_PAUSE_CLUB_v1.4.0_PATCH.b64.txt"
          V15="LA_PAUSE_CLUB_v1.5.0_PARITY_PATCH.b64.txt"

          test -f "$BASE"
          test -f "$V14"
          test -f "$V15"

          tr -d '\n\r ' < "$BASE" | base64 -d > base-project.zip
          echo "a06f6f88ccb7e9a8a954a98ffe0bc56a0e6986dd8c40ff58f30d3805fc9f8277  base-project.zip" | sha256sum -c -

          tr -d '\n\r ' < "$V14" | base64 -d > v14-patch.zip
          echo "d6366e1732a65920be81ef03f0a3fa7f83059897b9dac44d3e1ecbaab4561c72  v14-patch.zip" | sha256sum -c -

          tr -d '\n\r ' < "$V15" | base64 -d > v15-patch.zip
          echo "9e170dd57dcef321766288bc2453355ede99d487de2e68e61e5cbe5dda3b394b  v15-patch.zip" | sha256sum -c -

          rm -rf project
          mkdir -p project

          unzip -q -o base-project.zip -d project
          unzip -q -o v14-patch.zip -d project
          unzip -q -o v15-patch.zip -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/assets/v15.js
          test -f project/app/src/main/assets/v15.css

          test -f project/app/src/main/assets/media/ps5-available.png
          test -f project/app/src/main/assets/media/sim-vip.png
          test -f project/app/src/main/assets/media/products/redbull.jpg

          grep -q 'versionCode = 18' project/app/build.gradle.kts
          grep -q 'versionName = "1.5.0"' project/app/build.gradle.kts
          grep -q 'com.google.zxing:core:3.5.3' project/app/build.gradle.kts

          grep -q 'station-media-img-v132' project/app/src/main/assets/v13.js
          grep -q 'ANDROID_LEGACY_RESERVATION' project/app/src/main/assets/v15.js

          grep -q "case 'king':return renderCompetitionsV15('king')" project/app/src/main/assets/v15.js
          grep -q "case 'hall':return V15_ORIGINAL_RENDER_VIEW()" project/app/src/main/assets/v15.js

          grep -q 'Pass &amp; abonnements' project/app/src/main/assets/index.html
          grep -q 'Roi de la PS5' project/app/src/main/assets/index.html
          grep -q 'Hall PS5' project/app/src/main/assets/index.html
          grep -q 'Pause Points' project/app/src/main/assets/index.html
          grep -q 'Manettes &amp; accessoires' project/app/src/main/assets/index.html
          grep -q 'Clients &amp; rétention' project/app/src/main/assets/index.html
          grep -q 'Données &amp; sauvegardes' project/app/src/main/assets/index.html

          echo "LA PAUSE CLUB v1.5.0 PARITY reconstructed"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Static parity checks
        shell: bash
        run: |
          set -euxo pipefail

          node --check project/app/src/main/assets/app.js
          node --check project/app/src/main/assets/v13.js
          node --check project/app/src/main/assets/v14.js
          node --check project/app/src/main/assets/v15.js

          grep -q "ps5Solo:22" project/app/src/main/assets/app.js
          grep -q "ps5Duo:28" project/app/src/main/assets/app.js
          grep -q "sim:45" project/app/src/main/assets/app.js
          grep -q "defaultPaymentTiming:'start'" project/app/src/main/assets/app.js

          grep -q 'POST_NOTIFICATIONS' project/app/src/main/AndroidManifest.xml
          grep -q 'RECEIVE_BOOT_COMPLETED' project/app/src/main/AndroidManifest.xml
          grep -q 'configChanges="orientation' project/app/src/main/AndroidManifest.xml

          grep -q 'generateQrDataUrl' project/app/src/main/java/com/lapauseclub/manager/MainActivity.java
          grep -q 'QRCodeWriter' project/app/src/main/java/com/lapauseclub/manager/MainActivity.java

          test -f project/TEST_REPORT.md
          test -f project/V1.5.0_NOTES.md

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          ls -lh "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" | tee apk-badging.txt

          grep "versionCode='18'" apk-badging.txt
          grep "versionName='1.5.0'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt

          unzip -l "$APK" | grep 'assets/v15.js'
          unzip -l "$APK" | grep 'assets/v15.css'

          unzip -l "$APK" | grep 'assets/media/ps5-available.png'
          unzip -l "$APK" | grep 'assets/media/sim-vip.png'
          unzip -l "$APK" | grep 'assets/media/products/redbull.jpg'

          unzip -p "$APK" assets/v15.js | grep -q 'ANDROID_LEGACY_RESERVATION'
          unzip -p "$APK" assets/v15.js | grep -q "case 'hall':return V15_ORIGINAL_RENDER_VIEW()"
          unzip -p "$APK" assets/v15.js | grep -q 'VENUE_PAUSE_ALL'
          unzip -p "$APK" assets/v15.js | grep -q 'Checklist avant clôture'

          cp "$APK" "LA-PAUSE-CLUB-Manager-v1.5.0-parity-debug.apk"

          sha256sum "LA-PAUSE-CLUB-Manager-v1.5.0-parity-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.5.0-parity-debug
          path: LA-PAUSE-CLUB-Manager-v1.5.0-parity-debug.apk
          if-no-files-found: error
          retention-days: 30
