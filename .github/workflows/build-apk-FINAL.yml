name: Build LA PAUSE CLUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and extract Android project
        shell: bash
        run: |
          set -euxo pipefail
          SRC="LA_PAUSE_CLUB_Android_GitHubReady_v1.2.0.b64.txt"
          test -f "$SRC"
          tr -d '\n\r ' < "$SRC" | base64 -d > project.zip
          echo "623e373fa5a4405c09d5117306755bbadf9c0e96450fbce9bd87d6e1ced8a3b9  project.zip" | sha256sum -c -
          rm -rf project
          mkdir -p project
          unzip -o project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Android project extracted successfully"

      - name: Patch compile SDK for GitHub runner
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/compileSdk = 37/compileSdk = 36/' project/app/build.gradle.kts
          grep -nE 'compileSdk|targetSdk|minSdk|versionCode|versionName' project/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | head -30
          cp "$APK" "LA-PAUSE-CLUB-Manager-v1.2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.2.0-debug
          path: LA-PAUSE-CLUB-Manager-v1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
