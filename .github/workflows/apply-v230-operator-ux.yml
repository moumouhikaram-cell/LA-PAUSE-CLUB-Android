name: Apply v2.3 Operator UX

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - ".ops-stage/operator-trigger.txt"

permissions:
  contents: write

jobs:
  apply-operator-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-client-final-v230
          fetch-depth: 0

      - name: Rebuild staged operator payload
        shell: bash
        run: |
          set -euxo pipefail
          cat .ops-stage/operator_payload.b64.00 .ops-stage/operator_payload.b64.01 .ops-stage/operator_payload.b64.02 > /tmp/operator_payload.b64
          base64 -d /tmp/operator_payload.b64 > /tmp/operator_payload.tar.gz
          mkdir -p .ops-stage/payload
          tar -xzf /tmp/operator_payload.tar.gz -C .ops-stage/payload
          test -f .ops-stage/payload/client-operator-v230.js
          test -f .ops-stage/payload/client-operator-v230.css
          test -f .ops-stage/payload/apply_operator_patch.py

      - name: Apply operator-first product patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ops-stage/payload/apply_operator_patch.py
          node --check v16-original-source/app/src/main/assets/client-operator-v230.js
          node --check v16-original-source/tools/client-v230-e2e.spec.js
          grep -q 'client-operator-v230.css' v16-original-source/app/src/main/assets/index.html
          grep -q 'client-operator-v230.js' v16-original-source/app/src/main/assets/index.html
          grep -q 'V230_BILLING_SEMANTICS_OK' v16-original-source/tools/client-v230-e2e.spec.js
          grep -q 'V230_OPERATOR_SPEED_OK' v16-original-source/tools/client-v230-e2e.spec.js
          grep -q 'V230_MARKETING_CONVERSION_OK' v16-original-source/tools/client-v230-e2e.spec.js
          grep -q 'V230_MEDIA_8_TYPES_OK' v16-original-source/tools/client-v230-e2e.spec.js
          git diff --check

      - name: Commit operator-first UX source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "moumouhikaram-cell"
          git config user.email "moumouhi.karam@gmail.com"
          git add v16-original-source/app/src/main/assets/client-operator-v230.js \
                  v16-original-source/app/src/main/assets/client-operator-v230.css \
                  v16-original-source/app/src/main/assets/index.html \
                  v16-original-source/tools/client-v230-e2e.spec.js
          git commit -m "feat(v230): operator-first control center and contextual conversion UX"
          git push origin HEAD:android-client-final-v230
