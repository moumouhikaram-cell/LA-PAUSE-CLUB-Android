name: Apply v2.3 Operator UX

on:
  push:
    branches:
      - android-client-final-v230
    paths:
      - ".ops-stage/operator-trigger.txt"

permissions:
  contents: write

jobs:
  patch-operator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-client-final-v230
          fetch-depth: 0
      - name: Align legacy journey with operator UX and prove assisted revenue
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v16-original-source/tools/client-v230-e2e.spec.js')
          s=p.read_text()
          old="""  await expect(page.locator('#startSessionBtn')).toBeVisible();
  await expect(page.locator('#payNow')).toBeChecked();
  const duration30=page.locator('[data-duration=\"30\"]');
  if(await duration30.count()) await duration30.click();
  const duo=page.locator('[data-players=\"2\"]');
"""
          new="""  await expect(page.locator('#startSessionBtn')).toBeVisible();
  await expect(page.locator('.ops-payment-line')).toContainText('Paiement au démarrage');
  await expect(page.locator('#startSessionBtn')).toContainText('Encaisser');
  const duration30=page.locator('[data-ops-duration=\"30\"]');
  if(await duration30.count()) await duration30.click();
  const duo=page.locator('[data-ops-players=\"2\"]');
"""
          if old not in s: raise SystemExit('legacy PS5 assertion block not found')
          s=s.replace(old,new,1)
          old2="""  await expect(row).toContainText('+30 min');
  await row.click();
  const s=await page.evaluate(()=>state.sessions.find(x=>x.id==='qa-smart-session'));
  expect(Math.round(Number(s.plannedMinutes))).toBe(60); expect(Number(s.totalAmount)).toBeGreaterThan(11);
  expect(errors).toEqual([]);
  console.log('V230_MARKETING_CONVERSION_OK');
"""
          new2="""  await expect(row).toContainText('+30 min');
  await row.click();
  await expect.poll(()=>currentRoute(page)).toBe('csHome');
  await expect(page.locator('#overlay')).not.toHaveClass(/show/);
  const data=await page.evaluate(()=>({s:state.sessions.find(x=>x.id==='qa-smart-session'),metrics:state.operatorMetrics||{}}));
  expect(Math.round(Number(data.s.plannedMinutes))).toBe(60); expect(Number(data.s.totalAmount)).toBeGreaterThan(11);
  expect(Number(data.metrics.assistedRevenue||0)).toBeGreaterThan(0);
  expect(Number(data.metrics.acceptedActions||0)).toBe(1);
  await expect(page.locator('.ops-live-assisted')).toContainText('CA ASSISTÉ');
  expect(errors).toEqual([]);
  console.log('V230_ASSISTED_REVENUE_OK');
  console.log('V230_MARKETING_CONVERSION_OK');
"""
          if old2 not in s: raise SystemExit('marketing assertion block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check v16-original-source/tools/client-v230-e2e.spec.js
          grep -q 'V230_ASSISTED_REVENUE_OK' v16-original-source/tools/client-v230-e2e.spec.js
          git diff --check
      - name: Commit journey contract
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "moumouhikaram-cell"
          git config user.email "moumouhi.karam@gmail.com"
          git add v16-original-source/tools/client-v230-e2e.spec.js
          git commit -m "test(v230): enforce operator payment and assisted revenue journeys"
          git push origin HEAD:android-client-final-v230
