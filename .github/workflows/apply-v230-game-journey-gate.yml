name: Apply v2.3 Game Journey Gate

on:
  push:
    branches:
      - android-client-final-v230
    paths:
      - ".ops-stage/game-journeys-trigger.txt"

permissions:
  contents: write

jobs:
  apply-game-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-client-final-v230
          fetch-depth: 0

      - name: Align journey harness with real entry controls
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v16-original-source/tools/client-v230-game-journeys.spec.js')
          s=p.read_text()
          old='''  const quick=card.locator(`[data-ops-quick-id="${id}"]`);\n  await expect(quick).toBeVisible();\n  await quick.click();\n'''
          new='''  const quick=card.locator(`[data-ops-quick-id="${id}"]`);\n  if(await quick.count()){\n    await expect(quick).toBeVisible();\n    await quick.click();\n  }else{\n    const start=card.locator(`[data-cs-start="${id}"]`).first();\n    await expect(start).toBeVisible();\n    await start.click();\n  }\n'''
          if old in s:s=s.replace(old,new,1)
          if 'if(await quick.count())' not in s:raise SystemExit('journey entry patch not applied')
          p.write_text(s)
          PY
          node --check v16-original-source/tools/client-v230-game-journeys.spec.js
          git diff --check

      - name: Commit journey harness
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "moumouhikaram-cell"
          git config user.email "moumouhi.karam@gmail.com"
          git add v16-original-source/tools/client-v230-game-journeys.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "test(v230): follow real entry control for each game journey"
          git push origin HEAD:android-client-final-v230
