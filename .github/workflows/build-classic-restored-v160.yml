name: Build CLASSIC RESTORED v1.6.0

on:
  workflow_dispatch:
  push:
    branches:
      - android-classic-restored-v160
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-classic-restored-v160.yml"

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prove exact historical v1.6 active shell
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object v16-original-source/app/build.gradle.kts)" = "e40c86ad23fbf3042fc25d5b9e1a58139f172414"
          test "$(git hash-object v16-original-source/app/src/main/AndroidManifest.xml)" = "33636fd6f089837cb24c90083f687ff67ee8dc30"
          test "$(git hash-object v16-original-source/app/src/main/assets/index.html)" = "b4bcb4477d55cad324c25bfdb611628893415c0e"
          test "$(git hash-object v16-original-source/app/src/main/assets/app.css)" = "ee2d33799164b14d012abc0aecc3c94c5e214250"
          test "$(git hash-object v16-original-source/app/src/main/assets/app.js)" = "4cbafc7dfadcd086a0387e4b7bec3de4cc2074b1"
          test "$(git hash-object v16-original-source/app/src/main/assets/v13.css)" = "ee295d223f75d007b4db542b283bd194bba24fe1"
          test "$(git hash-object v16-original-source/app/src/main/assets/v13.js)" = "5b6d3468a314012c6ce793ce8de21630a18ea273"
          test "$(git hash-object v16-original-source/app/src/main/assets/v14.css)" = "1c4c083a2b4c164ed90658470159c2ea0baddfcf"
          test "$(git hash-object v16-original-source/app/src/main/assets/v14.js)" = "42134cceabd9c15dc52cfde30b7d5ca3818b1502"
          test "$(git hash-object v16-original-source/app/src/main/assets/v15.css)" = "8b5d7ef51d3f5d49cf06ee27f32585dca9a0c34e"
          test "$(git hash-object v16-original-source/app/src/main/assets/v15.js)" = "ab2288f35b39620b7c6c0401d342ce9349f17959"
          test "$(git hash-object v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java)" = "bab0a577e167e42a4e35f430c7b6a6b85fabc305"
          test "$(git hash-object v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java)" = "e5af1005e089e88782ac154b5bf72e33a82ac2e8"

          grep -q 'android:name=".MainActivity"' v16-original-source/app/src/main/AndroidManifest.xml
          ! grep -q 'android:name=".NewAppActivity"' v16-original-source/app/src/main/AndroidManifest.xml
          grep -q '<script src="app.js"></script>' v16-original-source/app/src/main/assets/index.html
          grep -q '<script src="v13.js"></script>' v16-original-source/app/src/main/assets/index.html
          grep -q '<script src="v14.js"></script>' v16-original-source/app/src/main/assets/index.html
          grep -q '<script src="v15.js"></script>' v16-original-source/app/src/main/assets/index.html
          ! grep -qi 'v250/' v16-original-source/app/src/main/assets/index.html
          ! grep -qi 'saas' v16-original-source/app/src/main/assets/index.html
          ! grep -qi 'onboarding' v16-original-source/app/src/main/assets/index.html

          test -f v16-original-source/app/src/main/assets/media/ps5-available.png
          test -f v16-original-source/app/src/main/assets/media/sim-vip.png
          test -f v16-original-source/app/src/main/assets/media/esport-dynamic.png
          test -f v16-original-source/app/src/main/assets/media/tactical-dynamic.png
          test -f v16-original-source/app/src/main/assets/media/products/redbull.jpg
          test -f v16-original-source/app/src/main/assets/media/products/cocacola.jpg
          test -f v16-original-source/app/src/main/assets/media/products/fanta.jpg
          test -f v16-original-source/app/src/main/assets/media/products/lays.jpg
          test -f v16-original-source/app/src/main/assets/media/products/oreo.jpg
          test -f v16-original-source/app/src/main/assets/media/products/snickers.jpg
          test -f v16-original-source/app/src/main/assets/media/products/sprite.jpg
          test -f v16-original-source/app/src/main/assets/media/products/twix.jpg

          # Modern modules must still exist in the repository, but stay parked/unloaded.
          test -f v16-original-source/app/src/main/assets/v250/index.html
          test -f v16-original-source/app/src/main/assets/client-operator-v230.js
          test -f v16-original-source/app/src/main/assets/p2-device-control-v240.js
          test -f v16-original-source/app/src/main/assets/client-saas-workspaces-v240.js
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/PremiumActivity.java
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/SyncBridgeV12.java
          test -d v16-original-source/app/src/main/java/com/lapauseclub/manager/security
          test -f v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreAuthorityGuardV12.java

          node --check v16-original-source/app/src/main/assets/app.js
          node --check v16-original-source/app/src/main/assets/v13.js
          node --check v16-original-source/app/src/main/assets/v14.js
          node --check v16-original-source/app/src/main/assets/v15.js

      - name: Park modern modules outside historical package
        shell: bash
        run: |
          set -euxo pipefail

          # Java: keep ONLY the exact runtime that existed in historical v1.6.
          ROOT="v16-original-source/app/src/main/java/com/lapauseclub/manager"
          PARK_JAVA="$RUNNER_TEMP/parked-modern-java"
          mkdir -p "$PARK_JAVA"
          while IFS= read -r -d '' src; do
            rel="${src#$ROOT/}"
            case "$rel" in
              MainActivity.java|BootReceiver.java|SessionAlarmReceiver.java|core/CoreStore.java)
                echo "KEEP historical Java: $rel"
                ;;
              *)
                mkdir -p "$PARK_JAVA/$(dirname "$rel")"
                mv "$src" "$PARK_JAVA/$rel"
                echo "PARK modern Java: $rel"
                ;;
            esac
          done < <(find "$ROOT" -type f -name '*.java' -print0)
          mapfile -t LEFT_JAVA < <(find "$ROOT" -type f -name '*.java' | sort)
          test "${#LEFT_JAVA[@]}" -eq 4
          test -f "$PARK_JAVA/NewAppActivity.java"
          test -f "$PARK_JAVA/PremiumActivity.java"
          test -f "$PARK_JAVA/SyncBridgeV12.java"
          test -f "$PARK_JAVA/core/CoreAuthorityGuardV12.java"
          test -f "$PARK_JAVA/security/EntitlementVerifier.java"

          # Assets: package ONLY the exact 42 files present in historical v1.6 APK.
          ASSETS="v16-original-source/app/src/main/assets"
          PARK_ASSETS="$RUNNER_TEMP/parked-modern-assets"
          mkdir -p "$PARK_ASSETS"
          while IFS= read -r -d '' src; do
            rel="${src#$ASSETS/}"
            case "$rel" in
              app.css|app.js|index.html|logo.svg|v13.css|v13.js|v14.css|v14.js|v15.css|v15.js|\
              media/combat-dynamic.png|media/combat.svg|media/esport-dynamic.png|media/esport-team.jpg|media/esport.svg|\
              media/football-dynamic.png|media/football.svg|media/idle.svg|\
              media/products/chips.svg|media/products/chocolate.svg|media/products/cocacola.jpg|media/products/coffee.svg|media/products/cola.svg|media/products/energy.svg|media/products/fanta.jpg|media/products/lays.jpg|media/products/oreo.jpg|media/products/redbull.jpg|media/products/snickers.jpg|media/products/sprite.jpg|media/products/twix.jpg|media/products/water.svg|\
              media/ps5-available.png|media/ps5-default.jpg|media/racing-dynamic.png|media/racing.svg|media/sim-racing.jpg|media/sim-vip.png|media/sim.svg|media/tactical-dynamic.png|media/tactical.jpg|media/tactical.svg)
                echo "KEEP historical asset: $rel"
                ;;
              *)
                mkdir -p "$PARK_ASSETS/$(dirname "$rel")"
                mv "$src" "$PARK_ASSETS/$rel"
                echo "PARK modern asset: $rel"
                ;;
            esac
          done < <(find "$ASSETS" -type f -print0)
          mapfile -t LEFT_ASSETS < <(find "$ASSETS" -type f | sort)
          printf '%s\n' "${LEFT_ASSETS[@]}"
          test "${#LEFT_ASSETS[@]}" -eq 42
          test -f "$PARK_ASSETS/v250/index.html"
          test -f "$PARK_ASSETS/client-operator-v230.js"
          test -f "$PARK_ASSETS/p2-device-control-v240.js"
          test -f "$PARK_ASSETS/client-saas-workspaces-v240.js"

      - name: Restore permanent signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"; test -n "$KS_PASS"; test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify restored v1.6 APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$RUNNER_TEMP/la-pause-v160-restored-aligned.apk"
          S="LA-PAUSE-CLUB-Manager-v1.6.0-FINAL-RESTORED-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee restored-v160-certificate.txt
          "$BT/aapt" dump badging "$S" | tee restored-v160-badging.txt
          grep "package: name='com.lapauseclub.manager'" restored-v160-badging.txt
          grep "versionCode='19'" restored-v160-badging.txt
          grep "versionName='1.6.0'" restored-v160-badging.txt

          unzip -Z1 "$S" | grep '^assets/' | sort > restored-v160-assets.txt
          test "$(wc -l < restored-v160-assets.txt)" -eq 42
          grep -qx 'assets/app.js' restored-v160-assets.txt
          grep -qx 'assets/v15.js' restored-v160-assets.txt
          grep -qx 'assets/media/ps5-available.png' restored-v160-assets.txt
          grep -qx 'assets/media/sim-vip.png' restored-v160-assets.txt
          grep -qx 'assets/media/products/redbull.jpg' restored-v160-assets.txt
          ! grep -q '^assets/v250/' restored-v160-assets.txt
          ! grep -qi 'saas' restored-v160-assets.txt
          ! grep -qi 'onboarding' restored-v160-assets.txt

          unzip -p "$S" assets/index.html > restored-v160-index.html
          ! grep -qi 'v250/' restored-v160-index.html
          ! grep -qi 'saas' restored-v160-index.html
          ! grep -qi 'onboarding' restored-v160-index.html
          sha256sum "$S" | tee restored-v160-sha256.txt
          stat -c '%s bytes' "$S" | tee restored-v160-size.txt

      - name: Cleanup key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-v160-restored-aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.6.0-FINAL-RESTORED-SIGNED
          path: |
            LA-PAUSE-CLUB-Manager-v1.6.0-FINAL-RESTORED-SIGNED.apk
            restored-v160-certificate.txt
            restored-v160-badging.txt
            restored-v160-assets.txt
            restored-v160-sha256.txt
            restored-v160-size.txt
          if-no-files-found: error
          retention-days: 90
