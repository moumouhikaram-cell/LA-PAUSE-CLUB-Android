name: Production Entitlement Authority Check

on:
  workflow_dispatch:
  push:
    branches:
      - android-device-control-v240
    paths:
      - ".github/workflows/v240-prod-entitlement-authority-check.yml"

permissions:
  contents: read

jobs:
  authority-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production entitlement private secret
        shell: bash
        env:
          ENT_PRIVATE_B64: ${{ secrets.LA_PAUSE_ENTITLEMENT_PRIVATE_KEY_B64 }}
          ENT_PRIVATE_PEM: ${{ secrets.LA_PAUSE_ENTITLEMENT_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$ENT_PRIVATE_B64" ] && [ -z "$ENT_PRIVATE_PEM" ]; then
            echo PROD_ENTITLEMENT_PRIVATE_KEY_ABSENT
            exit 20
          fi
          if [ -n "$ENT_PRIVATE_B64" ] && [ -n "$ENT_PRIVATE_PEM" ]; then
            echo PROD_ENTITLEMENT_PRIVATE_KEY_AMBIGUOUS
            exit 21
          fi
          echo PROD_ENTITLEMENT_PRIVATE_KEY_PRESENT_OK

      - name: Verify production entitlement private key matches pinned public key
        shell: bash
        env:
          ENT_PRIVATE_B64: ${{ secrets.LA_PAUSE_ENTITLEMENT_PRIVATE_KEY_B64 }}
          ENT_PRIVATE_PEM: ${{ secrets.LA_PAUSE_ENTITLEMENT_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const b64=String(process.env.ENT_PRIVATE_B64||'').trim();
          const pem=String(process.env.ENT_PRIVATE_PEM||'').trim();
          let privateKey;
          try{
            privateKey=b64
              ? crypto.createPrivateKey({key:Buffer.from(b64.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'})
              : crypto.createPrivateKey(pem);
          }catch(_e){
            console.log('PROD_ENTITLEMENT_PRIVATE_KEY_INVALID');
            process.exit(22);
          }
          const actual=crypto.createPublicKey(privateKey).export({format:'der',type:'spki'});
          const pinned=Buffer.from(fs.readFileSync('contracts/security/entitlement-prod-v1-public.der.b64','utf8').replace(/\s+/g,''),'base64');
          if(actual.length!==pinned.length||!crypto.timingSafeEqual(actual,pinned)){
            console.log('PROD_ENTITLEMENT_PRIVATE_KEY_MISMATCH');
            process.exit(23);
          }
          console.log('PROD_ENTITLEMENT_PRIVATE_KEY_MATCH_OK');
          NODE

      - name: Check existing signed bootstrap secret
        if: always()
        working-directory: v16-original-source
        shell: bash
        env:
          LA_PAUSE_BOOTSTRAP_ENTITLEMENT_B64: ${{ secrets.LA_PAUSE_BOOTSTRAP_ENTITLEMENT_B64 }}
          LA_PAUSE_ENTITLEMENT_KEY_ID: ${{ secrets.LA_PAUSE_ENTITLEMENT_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$LA_PAUSE_BOOTSTRAP_ENTITLEMENT_B64" ]; then
            echo BOOTSTRAP_ENTITLEMENT_SECRET_ABSENT
            exit 0
          fi
          node tools/verify-bootstrap-entitlement-v240.js ../contracts/security/entitlement-prod-v1-public.der.b64
          echo BOOTSTRAP_ENTITLEMENT_SECRET_VALID_OK
