name: Build CLASSIC RESTORED v1.3.1

on:
  workflow_dispatch:
  push:
    branches:
      - android-classic-restored-v131
    paths:
      - 'LA_PAUSE_CLUB_Android_GitHubReady_v1.3.1.b64.txt'
      - 'classic-overlays/**'
      - 'docs/CLASSIC_RESTORE_MODULE_INVENTORY.md'
      - '.github/workflows/build-classic-restored-v131.yml'

permissions:
  contents: read

jobs:
  classic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4

      - name: Rebuild exact historical v1.3.1 source
        shell: bash
        run: |
          set -euxo pipefail
          SRC='LA_PAUSE_CLUB_Android_GitHubReady_v1.3.1.b64.txt'
          test -f "$SRC"
          tr -d '\n\r ' < "$SRC" | base64 -d > classic-v131.zip
          echo 'ea0efa23e38e224596e6d57623f57d0712b1b8739fc73fe638c5a616071f6f0e  classic-v131.zip' | sha256sum -c -
          rm -rf project
          mkdir -p project
          unzip -q -o classic-v131.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/assets/index.html
          test -f project/app/src/main/assets/app.css
          test -f project/app/src/main/assets/app.js
          test -f project/app/src/main/assets/v13.css
          test -f project/app/src/main/assets/v13.js

      - name: Prove classic shell only
        shell: bash
        run: |
          set -euxo pipefail
          INDEX='project/app/src/main/assets/index.html'
          grep -q 'LA PAUSE CLUB · Manager' "$INDEX"
          grep -q 'Gaming Floor' "$INDEX"
          grep -q 'Sessions' "$INDEX"
          grep -q 'Caisse express' "$INDEX"
          grep -q 'Tournois' "$INDEX"
          grep -q 'TV &amp; Stations' "$INDEX"
          grep -q '<script src="app.js"></script>' "$INDEX"
          grep -q '<script src="v13.js"></script>' "$INDEX"
          ! grep -qi 'onboarding' "$INDEX"
          ! grep -qi 'saas' "$INDEX"
          ! grep -q 'client-saas-workspaces-v240.js' "$INDEX"
          ! grep -q 'p5-saas.js' "$INDEX"
          echo 'CLASSIC_V131_SHELL_ONLY_OK'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Static JavaScript checks
        shell: bash
        run: |
          set -euxo pipefail
          node --check project/app/src/main/assets/app.js
          node --check project/app/src/main/assets/v13.js

      - name: Build restored APK
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify restored APK
        shell: bash
        run: |
          set -euxo pipefail
          APK='project/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee classic-badging.txt
          grep "versionCode='15'" classic-badging.txt
          grep "versionName='1.3.1'" classic-badging.txt
          grep "targetSdkVersion:'36'" classic-badging.txt
          unzip -p "$APK" assets/index.html > packaged-index.html
          grep -q 'LA PAUSE CLUB · Manager' packaged-index.html
          ! grep -qi 'onboarding' packaged-index.html
          ! grep -qi 'saas' packaged-index.html
          cp "$APK" 'LA-PAUSE-CLUB-Manager-CLASSIC-v1.3.1-RESTORED.apk'
          sha256sum 'LA-PAUSE-CLUB-Manager-CLASSIC-v1.3.1-RESTORED.apk' | tee classic-apk-sha256.txt
          ls -lh 'LA-PAUSE-CLUB-Manager-CLASSIC-v1.3.1-RESTORED.apk'
          echo 'CLASSIC_V131_RESTORE_OK'

      - name: Upload restored app
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-CLASSIC-v1.3.1-RESTORED
          path: |
            LA-PAUSE-CLUB-Manager-CLASSIC-v1.3.1-RESTORED.apk
            classic-badging.txt
            classic-apk-sha256.txt
            packaged-index.html
          if-no-files-found: error
          retention-days: 90
