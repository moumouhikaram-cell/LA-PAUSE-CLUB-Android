name: Build Signed LA PAUSE OS 2.6.0 Canonical SaaS

on:
  workflow_dispatch:
  push:
    branches: [android-new-app-v250]
    paths:
      - "docs/frozen/**"
      - "v16-original-source/app/src/main/assets/v250/**"
      - "v16-original-source/app/src/main/java/com/lapauseclub/manager/NewAppActivity.java"
      - "v16-original-source/app/src/main/AndroidManifest.xml"
      - "v16-original-source/app/build.gradle.kts"
      - "v16-original-source/tools/test-v250-new-app.js"
      - ".github/workflows/build-v250-new-app-signed.yml"
      - ".github/workflows/android-v250-native-smoke.yml"

permissions:
  contents: read

jobs:
  signed-canonical-saas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Enforce frozen canonical SaaS contract
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/v250/saas-core.js
          node --check app/src/main/assets/v250/version-v260.js
          node --check app/src/main/assets/v250/media.js
          node --check app/src/main/assets/v250/canonical-screens.js
          node --check app/src/main/assets/v250/canonical-overrides-v270.js
          node --check app/src/main/assets/v250/canonical-app.js
          for f in app/src/main/assets/v250/screens*.js; do node --check "$f"; done
          node tools/test-v250-new-app.js
          test -s ../docs/frozen/LA_PAUSE_OS_MASTER_NON_REGRESSION_CONTRACT_FROZEN_2026-09-05.md
          test -s ../docs/frozen/LA_PAUSE_OS_SCREEN_REQUIREMENTS_MAPPING_FROZEN_2026-09-05.md
          test -s ../docs/frozen/LA_PAUSE_OS_CANONICAL_TEMPLATE_HASH_MANIFEST_2026-09-05.txt
          grep -q 'android:name=".NewAppActivity"' app/src/main/AndroidManifest.xml
          ! grep -q 'PremiumActivity' app/src/main/AndroidManifest.xml
          grep -q 'v250/index.html' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'confirmExit()' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'createLocalCredential' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'verifyLocalCredential' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'PBKDF2WithHmacSHA256' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'MessageDigest.isEqual' app/src/main/java/com/lapauseclub/manager/NewAppActivity.java
          grep -q 'canonical-screens.js' app/src/main/assets/v250/index.html
          grep -q 'canonical-app.js' app/src/main/assets/v250/index.html
          grep -q 'canonical-ui.css' app/src/main/assets/v250/index.html
          grep -q 'canonical-overrides-v270.js' app/src/main/assets/v250/index.html
          grep -q 'canonical-pixel-v270.css' app/src/main/assets/v250/index.html
          grep -q 'media.js' app/src/main/assets/v250/index.html
          grep -q 'screens-00-truthful-bootstrap-v271.js' app/src/main/assets/v250/index.html
          grep -q 'screens-97-auth-ui-v271.js' app/src/main/assets/v250/index.html
          grep -q 'screens-98-truthful-ui-v271.js' app/src/main/assets/v250/index.html
          grep -q 'screens-99-runtime-safety-v271.js' app/src/main/assets/v250/index.html
          ! grep -q '<script src="app.js"></script>' app/src/main/assets/v250/index.html
          grep -q 'start-console:30:2' app/src/main/assets/v250/canonical-screens.js
          grep -q 'dx>82' app/src/main/assets/v250/canonical-app.js
          grep -q 'window.nativeBack' app/src/main/assets/v250/canonical-app.js
          grep -q '@media(orientation:landscape)' app/src/main/assets/v250/canonical-ui.css
          grep -q '\[dir="rtl"\]' app/src/main/assets/v250/canonical-ui.css

      - name: Load pinned prod-v2 verifier
        shell: bash
        run: |
          set -euo pipefail
          PUB_FILE="contracts/security/entitlement-prod-v2-public.der.b64"
          test -s "$PUB_FILE"
          ENT_PUB="$(tr -d '\r\n ' < "$PUB_FILE")"
          ACTUAL="$(printf '%s' "$ENT_PUB" | base64 -d | sha256sum | awk '{print $1}')"
          test "$ACTUAL" = "12ef99e5353d1f172a8a5e69cb90f36df68fa81adaa89e52e827f3b8d1eab1a7"
          echo "LA_PAUSE_ENTITLEMENT_PUBLIC_KEY_B64=$ENT_PUB" >> "$GITHUB_ENV"
          echo "LA_PAUSE_ENTITLEMENT_KEY_ID=prod-v2" >> "$GITHUB_ENV"

      - name: Restore permanent Android signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"; test -n "$KS_PASS"; test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/cert.pem"
          ACTUAL="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f"
          echo OFFICIAL_ANDROID_SIGNER_OK

      - name: Build R8 release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/mapping/release/mapping.txt

      - name: Sign and verify 2.6.0 canonical SaaS app
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/lp-v260-canonical-aligned.apk"
          OUT="LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee signed-v260-certificate.txt
          "$BT/aapt" dump badging "$OUT" | tee signed-v260-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-v260-badging.txt
          grep "versionCode='31'" signed-v260-badging.txt
          grep "versionName='2.6.0'" signed-v260-badging.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f' signed-v260-certificate.txt

          unzip -l "$OUT" > signed-v260-files.txt
          for f in \
            assets/v250/index.html \
            assets/v250/canonical-app.js \
            assets/v250/canonical-overrides-v270.js \
            assets/v250/canonical-pixel-v270.css \
            assets/v250/media.js \
            assets/v250/screens-00-truthful-bootstrap-v271.js \
            assets/v250/screens-97-auth-ui-v271.js \
            assets/v250/screens-98-truthful-ui-v271.js \
            assets/v250/screens-99-runtime-safety-v271.js; do
            grep -Fq "$f" signed-v260-files.txt || { echo "Missing signed runtime asset: $f"; exit 1; }
          done

          unzip -p "$OUT" assets/v250/index.html > signed-v260-index.html
          unzip -p "$OUT" assets/v250/canonical-ui.css > signed-v260-canonical-ui.css
          unzip -p "$OUT" assets/v250/canonical-screens.js > signed-v260-canonical-screens.js
          unzip -p "$OUT" assets/v250/canonical-app.js > signed-v260-canonical-app.js
          unzip -p "$OUT" assets/v250/saas-core.js > signed-v260-core.js
          unzip -p "$OUT" assets/v250/version-v260.js > signed-v260-version.js

          grep -q 'canonical-screens.js' signed-v260-index.html
          grep -q 'canonical-app.js' signed-v260-index.html
          grep -q 'canonical-ui.css' signed-v260-index.html
          grep -q 'canonical-overrides-v270.js' signed-v260-index.html
          grep -q 'canonical-pixel-v270.css' signed-v260-index.html
          grep -q 'media.js' signed-v260-index.html
          grep -q 'screens-00-truthful-bootstrap-v271.js' signed-v260-index.html
          grep -q 'screens-97-auth-ui-v271.js' signed-v260-index.html
          grep -q 'screens-98-truthful-ui-v271.js' signed-v260-index.html
          grep -q 'screens-99-runtime-safety-v271.js' signed-v260-index.html
          ! grep -q '<script src="app.js"></script>' signed-v260-index.html
          grep -q 'Duo · 30 min' signed-v260-canonical-screens.js
          grep -q 'start-console:30:2' signed-v260-canonical-screens.js
          grep -q 'Charge per game. Easy +1 game.' signed-v260-canonical-screens.js
          grep -q 'From setup to<br>ready for players' signed-v260-canonical-screens.js
          grep -q 'Owner Sentinel' signed-v260-canonical-screens.js
          grep -q 'ps5-available.png' signed-v260-canonical-screens.js
          grep -q "PR=M+'products/'" signed-v260-canonical-screens.js
          grep -q "return PR+'redbull.jpg'" signed-v260-canonical-screens.js
          grep -q "return PR+'cocacola.jpg'" signed-v260-canonical-screens.js
          grep -q 'dx>82' signed-v260-canonical-app.js
          grep -q 'window.nativeBack' signed-v260-canonical-app.js
          grep -q 'navStack' signed-v260-canonical-app.js
          grep -q '@media(orientation:landscape)' signed-v260-canonical-ui.css
          grep -q '\[dir="rtl"\]' signed-v260-canonical-ui.css
          grep -q 'M15_AI_OPERATOR' signed-v260-core.js
          grep -q 'acceptedActions' signed-v260-core.js
          grep -q 'assistedRevenue' signed-v260-core.js
          grep -q "appVersion='2.6.0'" signed-v260-version.js
          grep -q "canonicalUi='FROZEN_01_44'" signed-v260-version.js

          sha256sum "$OUT" | tee signed-v260-sha256.txt
          stat -c '%s bytes' "$OUT" | tee signed-v260-size.txt

      - name: Build verification manifest
        shell: bash
        run: |
          {
            echo 'LA PAUSE OS Android 2.6.0 — FROZEN CANONICAL SAAS'
            echo "Commit: $GITHUB_SHA"
            echo 'Launcher: com.lapauseclub.manager.NewAppActivity'
            echo 'Visible rejected v2.5 shell: NOT LOADED'
            echo 'Canonical visual contract: screens 01-44'
            echo 'Non-regression surfaces: 45-60 preserved behind modules'
            echo 'Master contract: docs/frozen/LA_PAUSE_OS_MASTER_NON_REGRESSION_CONTRACT_FROZEN_2026-09-05.md'
            echo 'Navigation: modal-first back + internal stack + right-swipe back + exit confirmation at true root'
            echo 'Responsive: phone portrait + phone landscape + tablet + RTL + state restoration'
            echo 'Operator: Duo 30 / per-game billiard / +30 / +1 game / snack / NBA / assisted revenue'
            echo 'SaaS truth: empty bootstrap + no fake ONLINE/VERIFIED/ACTIVE + GO LIVE evidence gates'
            echo 'Auth: native PBKDF2-HMAC-SHA256 local credential verification; no unchecked sign-in'
            echo 'SaaS: tenant/workspace/venue/branch + M01-M15 + entitlement/RBAC + Edge/Cloud'
            echo 'Media: dynamic HD console/game/product assets wired in canonical screens'
            cat signed-v260-sha256.txt
            cat signed-v260-size.txt
          } > LA-PAUSE-OS-v2.6.0-CANONICAL-VERIFICATION.txt

      - name: Upload signed canonical SaaS app
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.6.0-CANONICAL-SIGNED.apk
            LA-PAUSE-OS-v2.6.0-CANONICAL-VERIFICATION.txt
            signed-v260-certificate.txt
            signed-v260-badging.txt
            signed-v260-sha256.txt
            signed-v260-size.txt
            v16-original-source/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
