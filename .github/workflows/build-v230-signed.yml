name: Build Signed LA PAUSE OS 2.3.0 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-v230-signed.yml"

permissions:
  contents: read

jobs:
  android-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK for native gate
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run debug APK on lightweight AOSP Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 1
          ram-size: 1536M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash v16-original-source/tools/android-native-smoke-v230.sh

      - name: Require complete native smoke
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'ANDROID_LAUNCH_OK' android-native-smoke.txt
          grep -q 'ANDROID_HOME_EXIT_DIALOG_OK' android-native-smoke.txt
          grep -q 'ANDROID_ROTATION_OK' android-native-smoke.txt
          grep -q 'ANDROID_LOGCAT_OK' android-native-smoke.txt
          grep -q 'ANDROID_NATIVE_SMOKE_OK' android-native-smoke.txt

      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v230-final-native-smoke-${{ github.run_number }}
          path: |
            android-native-smoke.txt
            android-native-trace.txt
            android-launch.txt
            android-focus.txt
            android-focus-back.txt
            android-window-back.xml
            android-window-portrait.xml
            android-logcat.txt
          if-no-files-found: warn
          retention-days: 30

  build-signed-final:
    needs: android-native-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare offline media and verify canonical 2.3 source
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          A=app/src/main/assets
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "2.3.0"' app/build.gradle.kts
          grep -q 'applicationId = "com.lapauseclub.manager"' app/build.gradle.kts
          grep -q 'android:name=".PremiumActivity"' app/src/main/AndroidManifest.xml
          for f in client-product-core.js client-product-session-policy.js client-operator-v230.js client-operator-actions-v230.js client-payment-guard-v230.js client-product-render-dispatch.js client-product-boot.js; do node --check "$A/$f"; done
          grep -q 'src="client-payment-guard-v230.js"' "$A/index.html"
          node --check tools/client-v230-game-journeys.spec.js

      - name: Restore permanent LA PAUSE signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          CERT_PEM="$RUNNER_TEMP/la-pause-signing-cert.pem"
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > "$CERT_PEM"
          ACTUAL="$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f"
          printf 'Signer certificate SHA-256: %s\n' "$ACTUAL" | tee signing-key-fingerprint.txt
          test "$ACTUAL" = "$EXPECTED"
          echo 'PERMANENT_SIGNING_KEY_OK' | tee -a signing-key-fingerprint.txt
          rm -f "$CERT_PEM"

      - name: Build release APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify final APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/la-pause-v230-aligned.apk"
          SIGNED="LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$SIGNED" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='28'" signed-badging.txt
          grep "versionName='2.3.0'" signed-badging.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: f154909d8c631131975553c41481b67c282f514beb0ed9ab228d7275fa8e321f' signed-certificate.txt
          unzip -p "$SIGNED" assets/index.html > signed-index.html
          grep -q 'client-payment-guard-v230.js' signed-index.html
          for f in ps5.jpg sim.jpg pc.jpg billiard.jpg snooker.jpg table-tennis.jpg arcade.jpg lounge.jpg; do unzip -l "$SIGNED" | grep -q "assets/media/premium/$f"; done
          sha256sum "$SIGNED" | tee signed-sha256.txt
          stat -c '%s bytes' "$SIGNED" | tee signed-size.txt

      - name: Run signed FINAL APK on lightweight AOSP Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 1
          ram-size: 1536M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash v16-original-source/tools/android-native-smoke-v230.sh LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk

      - name: Verify signed FINAL native smoke markers
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'ANDROID_LAUNCH_OK' android-native-smoke.txt
          grep -q 'ANDROID_HOME_EXIT_DIALOG_OK' android-native-smoke.txt
          grep -q 'ANDROID_ROTATION_OK' android-native-smoke.txt
          grep -q 'ANDROID_LOGCAT_OK' android-native-smoke.txt
          grep -q 'ANDROID_NATIVE_SMOKE_OK' android-native-smoke.txt

      - name: Create final manifest
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo 'LA PAUSE OS Android 2.3.0 FINAL'
            echo "Commit: $GITHUB_SHA"
            cat signing-key-fingerprint.txt
            cat signed-sha256.txt
            cat signed-size.txt
            cat android-native-smoke.txt
          } > LA-PAUSE-OS-Android-v2.3.0-FINAL-MANIFEST.txt

      - name: Upload FINAL signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk
            LA-PAUSE-OS-Android-v2.3.0-FINAL-MANIFEST.txt
            signed-sha256.txt
            signed-size.txt
            signed-certificate.txt
            signed-badging.txt
            android-native-smoke.txt
            android-native-trace.txt
          if-no-files-found: error
          retention-days: 90
