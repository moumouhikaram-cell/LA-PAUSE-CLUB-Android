name: Build Signed LA PAUSE OS 2.3.0 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - "v16-original-source/**"
      - ".github/workflows/build-v230-signed.yml"

permissions:
  contents: read

jobs:
  android-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare offline media and build debug APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash v16-original-source/tools/android-native-smoke-v230.sh

      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v230-final-native-smoke-${{ github.run_number }}
          path: |
            android-native-smoke.txt
            android-launch.txt
            android-focus.txt
            android-window-back.xml
            android-window-portrait.xml
            android-logcat.txt
          if-no-files-found: warn
          retention-days: 30

  build-signed-final:
    needs: android-native-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM acceleration for signed APK verification
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare contextual HD offline media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh | tee ../media-v230.txt

      - name: Full customer click E2E audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory app/src/main/assets >../e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v230-e2e.spec.js tools/client-v230-click-matrix.spec.js tools/client-v230-persistence.spec.js --reporter=line --workers=1 | tee ../e2e-v230.txt
          grep -q 'V230_SINGLE_RUNTIME_E2E_OK' ../e2e-v230.txt
          grep -q 'V230_ALL_ROUTES_CLICK_OK' ../e2e-v230.txt
          grep -q 'V230_BACK_HOME_EXIT_OK' ../e2e-v230.txt
          grep -q 'V230_ROTATION_PROGRESS_OK' ../e2e-v230.txt
          grep -q 'V230_SESSION_CLICK_FLOW_OK' ../e2e-v230.txt
          grep -q 'V230_SIM_CLICK_FLOW_OK' ../e2e-v230.txt
          grep -q 'V230_ALL_RESOURCE_TYPES_CLICK_OK' ../e2e-v230.txt
          grep -q 'V230_CLICK_MATRIX_OK' ../e2e-v230.txt
          grep -q 'V230_SETTINGS_DEPTH2_OK' ../e2e-v230.txt
          grep -q 'V230_CLIENT_E2E_OK' ../e2e-v230.txt
          grep -q 'V230_OPERATIONAL_PERSISTENCE_OK' ../e2e-v230.txt

      - name: Restore permanent LA PAUSE signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Final 2.3 product gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          A=app/src/main/assets
          J=app/src/main/java/com/lapauseclub/manager
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "2.3.0"' app/build.gradle.kts
          grep -q 'applicationId = "com.lapauseclub.manager"' app/build.gradle.kts
          grep -q 'android:name=".PremiumActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:enableOnBackInvokedCallback="true"' app/src/main/AndroidManifest.xml
          grep -q 'registerOnBackInvokedCallback' "$J/PremiumActivity.java"
          grep -q 'requestExitConfirmation' "$J/PremiumActivity.java"
          grep -q 'getSafeInsetsJson' "$J/PremiumActivity.java"
          for f in client-product-core.js client-product-media.js client-product-views.js client-product-setup.js client-product-session-policy.js client-product-shift-compat.js client-product-settings-compat.js client-product-boot.js master-v2-runtime.js master-v2-safety.js p1-core.js; do node --check "$A/$f"; done
          node --check tools/client-v230-e2e.spec.js
          node --check tools/client-v230-click-matrix.spec.js
          node --check tools/client-v230-persistence.spec.js
          grep -q 'src="client-product-session-policy.js"' "$A/index.html"
          grep -q 'src="client-product-shift-compat.js"' "$A/index.html"
          grep -q 'src="client-product-settings-compat.js"' "$A/index.html"
          grep -q 'client-product-v230.css' "$A/index.html"
          ! grep -q 'src="client-product-v230.js"' "$A/index.html"
          ! grep -q 'src="client-shell.js"' "$A/index.html"
          ! grep -q 'src="client-platform-guard.js"' "$A/index.html"
          ! grep -q 'src="client-hardening.js"' "$A/index.html"
          ! grep -q 'src="venue-experience.js"' "$A/index.html"
          ! grep -q 'src="p1-floor.js"' "$A/index.html"
          grep -q 'ps5Solo:22' "$A/app.js"
          grep -q 'ps5Duo:28' "$A/app.js"
          grep -q 'sim:45' "$A/app.js"
          grep -q "defaultPaymentTiming:'start'" "$A/app.js"
          node tools/client-v230-audit.js | tee ../client-v230-audit.txt
          grep -q 'V230_SINGLE_DASHBOARD_OK' ../client-v230-audit.txt
          grep -q 'V230_BACK_STACK_OK' ../client-v230-audit.txt
          grep -q 'V230_CASH_POLICY_OK' ../client-v230-audit.txt
          grep -q 'V230_SAAS_DASHBOARD_OK' ../client-v230-audit.txt
          grep -q 'V230_CONTEXT_MEDIA_OK' ../client-v230-audit.txt
          grep -q 'V230_CLIENT_AUDIT_OK' ../client-v230-audit.txt
          node tools/client-v230-policy-tests.js | tee ../policy-v230.txt
          grep -q 'V230_SESSION_POLICY_TESTS_OK' ../policy-v230.txt
          node tools/master-v2-domain-tests.js | tee ../domain-v230.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-v230.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-v230.txt
          grep -q 'ALL_TIMED_RESOURCE_TYPES_OK' ../domain-v230.txt

      - name: Build release APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify final APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/la-pause-v230-aligned.apk"
          SIGNED="LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$ALIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$SIGNED" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='28'" signed-badging.txt
          grep "versionName='2.3.0'" signed-badging.txt
          grep -qi 'Signer #1 certificate DN: CN=LA PAUSE OS' signed-certificate.txt
          unzip -l "$SIGNED" | tee signed-assets.txt
          for f in client-product-core.js client-product-media.js client-product-views.js client-product-setup.js client-product-session-policy.js client-product-shift-compat.js client-product-settings-compat.js client-product-boot.js client-product-core.css client-product-responsive.css client-product-v230.css; do grep -q "assets/$f" signed-assets.txt; done
          for f in ps5.jpg sim.jpg pc.jpg billiard.jpg snooker.jpg table-tennis.jpg arcade.jpg lounge.jpg; do grep -q "assets/media/premium/$f" signed-assets.txt; unzip -p "$SIGNED" "assets/media/premium/$f" | wc -c | awk '$1 > 120000'; done
          unzip -p "$SIGNED" assets/index.html > signed-index.html
          grep -q 'client-product-session-policy.js' signed-index.html
          grep -q 'client-product-shift-compat.js' signed-index.html
          grep -q 'client-product-settings-compat.js' signed-index.html
          ! grep -q 'src="client-product-v230.js"' signed-index.html
          ! grep -q 'src="client-shell.js"' signed-index.html
          ! grep -q 'src="client-platform-guard.js"' signed-index.html
          sha256sum "$SIGNED" | tee signed-sha256.txt
          stat -c '%s bytes' "$SIGNED" | tee signed-size.txt

      - name: Run the signed FINAL APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash v16-original-source/tools/android-native-smoke-v230.sh LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk

      - name: Verify signed FINAL native smoke markers
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'ANDROID_LAUNCH_OK' android-native-smoke.txt
          grep -q 'ANDROID_HOME_EXIT_DIALOG_OK' android-native-smoke.txt
          grep -q 'ANDROID_ROTATION_OK' android-native-smoke.txt
          grep -q 'ANDROID_LOGCAT_OK' android-native-smoke.txt
          grep -q 'ANDROID_NATIVE_SMOKE_OK' android-native-smoke.txt

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-v230-aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED
          path: |
            LA-PAUSE-OS-Android-v2.3.0-FINAL-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-assets.txt
            signed-index.html
            signed-sha256.txt
            signed-size.txt
            media-v230.txt
            e2e-v230.txt
            client-v230-audit.txt
            policy-v230.txt
            domain-v230.txt
            android-native-smoke.txt
            android-launch.txt
            android-focus.txt
            android-window-back.xml
            android-window-portrait.xml
            android-logcat.txt
          if-no-files-found: error
          retention-days: 30
