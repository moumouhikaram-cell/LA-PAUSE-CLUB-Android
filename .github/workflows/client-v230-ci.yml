name: LA PAUSE OS 2.3.0 Product CI

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - "v16-original-source/**"
      - ".github/workflows/client-v230-ci.yml"

permissions:
  contents: read

jobs:
  product-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare contextual HD offline media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v230.sh | tee ../media-v230.txt

      - name: JavaScript syntax gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          A=app/src/main/assets
          for f in client-product-core.js client-product-media.js client-product-views.js client-product-setup.js client-product-session-policy.js client-product-shift-compat.js client-product-settings-compat.js client-product-render-dispatch.js client-product-boot.js client-operator-v230.js client-operator-actions-v230.js master-v2-runtime.js master-v2-safety.js p1-core.js; do node --check "$A/$f"; done
          node --check tools/client-v230-e2e.spec.js
          node --check tools/client-v230-click-matrix.spec.js
          node --check tools/client-v230-persistence.spec.js
          node --check tools/client-v230-game-journeys.spec.js
          ! grep -q 'src="client-product-v230.js"' "$A/index.html"
          grep -q 'src="client-product-session-policy.js"' "$A/index.html"
          grep -q 'src="client-product-shift-compat.js"' "$A/index.html"
          grep -q 'src="client-product-settings-compat.js"' "$A/index.html"
          grep -q 'src="client-product-render-dispatch.js"' "$A/index.html"
          grep -q 'client-operator-v230.js' "$A/index.html"
          grep -q 'client-operator-actions-v230.js' "$A/index.html"
          grep -q 'client-product-v230.css' "$A/index.html"

      - name: Deep v2.3 structural audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v230-audit.js | tee ../client-v230-audit.txt
          grep -q 'V230_SINGLE_DASHBOARD_OK' ../client-v230-audit.txt
          grep -q 'V230_BACK_STACK_OK' ../client-v230-audit.txt
          grep -q 'V230_CASH_POLICY_OK' ../client-v230-audit.txt
          grep -q 'V230_SAAS_DASHBOARD_OK' ../client-v230-audit.txt
          grep -q 'V230_CONTEXT_MEDIA_OK' ../client-v230-audit.txt
          grep -q 'V230_CLIENT_AUDIT_OK' ../client-v230-audit.txt

      - name: Full customer click E2E and game journey audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory app/src/main/assets >../e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          LP_E2E_URL=http://127.0.0.1:4173/index.html npx playwright test tools/client-v230-e2e.spec.js tools/client-v230-click-matrix.spec.js tools/client-v230-persistence.spec.js tools/client-v230-game-journeys.spec.js --reporter=line --workers=1 | tee ../e2e-v230.txt
          grep -q 'V230_SINGLE_RUNTIME_E2E_OK' ../e2e-v230.txt
          grep -q 'V230_ALL_ROUTES_CLICK_OK' ../e2e-v230.txt
          grep -q 'V230_BACK_HOME_EXIT_OK' ../e2e-v230.txt
          grep -q 'V230_ROTATION_PROGRESS_OK' ../e2e-v230.txt
          grep -q 'V230_SESSION_CLICK_FLOW_OK' ../e2e-v230.txt
          grep -q 'V230_SIM_CLICK_FLOW_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_CONSOLE_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_SIM_RACING_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_PC_GAMING_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_BILLIARD_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_SNOOKER_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_TABLE_TENNIS_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_PRIVATE_ROOM_OK' ../e2e-v230.txt
          grep -q 'V230_JOURNEY_CUSTOM_OK' ../e2e-v230.txt
          grep -q 'V230_ALL_GAME_JOURNEYS_OK' ../e2e-v230.txt
          grep -q 'V230_ALL_RESOURCE_TYPES_CLICK_OK' ../e2e-v230.txt
          grep -q 'V230_CLICK_MATRIX_OK' ../e2e-v230.txt
          grep -q 'V230_SETTINGS_DEPTH2_OK' ../e2e-v230.txt
          grep -q 'V230_CLIENT_E2E_OK' ../e2e-v230.txt
          grep -q 'V230_OPERATIONAL_PERSISTENCE_OK' ../e2e-v230.txt

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v230-client-e2e-diagnostics-${{ github.run_number }}
          path: |
            e2e-v230.txt
            e2e-server.log
            v16-original-source/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Cash and session behavior tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v230-policy-tests.js | tee ../policy-v230.txt
          grep -q 'AUTO_SHIFT_SESSION_START_OK' ../policy-v230.txt
          grep -q 'DEFERRED_SESSION_WITHOUT_CASH_OK' ../policy-v230.txt
          grep -q 'PREPAY_POLICY_OK' ../policy-v230.txt
          grep -q 'MANUAL_CASH_AUTO_SHIFT_OK' ../policy-v230.txt
          grep -q 'V230_SESSION_POLICY_TESTS_OK' ../policy-v230.txt

      - name: Universal transaction regression tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/master-v2-domain-tests.js | tee ../domain-v230.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-v230.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-v230.txt
          grep -q 'ALL_TIMED_RESOURCE_TYPES_OK' ../domain-v230.txt

      - name: Compile Android 2.3.0
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac
