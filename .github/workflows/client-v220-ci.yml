name: LA PAUSE OS 2.2.0 Product CI

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v220
    paths:
      - "v16-original-source/**"
      - ".github/workflows/client-v220-ci.yml"

permissions:
  contents: read

jobs:
  product-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare final HD offline media
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/prepare-client-media-v220.sh | tee ../media-v220.txt

      - name: Syntax and single-shell gates
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          A=app/src/main/assets
          for f in client-product-core.js client-product-media.js client-product-views.js client-product-setup.js client-product-boot.js master-v2-runtime.js master-v2-safety.js p1-core.js; do node --check "$A/$f"; done
          grep -q 'client-product-core.js' "$A/index.html"
          grep -q 'client-product-media.js' "$A/index.html"
          grep -q 'client-product-views.js' "$A/index.html"
          grep -q 'client-product-setup.js' "$A/index.html"
          grep -q 'client-product-boot.js' "$A/index.html"
          ! grep -q 'src="client-shell.js"' "$A/index.html"
          ! grep -q 'src="client-platform-guard.js"' "$A/index.html"
          ! grep -q 'src="client-hardening.js"' "$A/index.html"
          ! grep -q 'src="venue-experience.js"' "$A/index.html"
          ! grep -q 'src="p1-floor.js"' "$A/index.html"
          grep -q 'ps5Solo:22' "$A/app.js"
          grep -q 'ps5Duo:28' "$A/app.js"
          grep -q 'sim:45' "$A/app.js"
          grep -q "defaultPaymentTiming:'start'" "$A/app.js"

      - name: Deep customer product audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/client-v220-audit.js | tee ../client-v220-audit.txt
          grep -q 'SINGLE_DASHBOARD_OK' ../client-v220-audit.txt
          grep -q 'MENU_GROUPS_OK' ../client-v220-audit.txt
          grep -q 'RESPONSIVE_ROTATION_OK' ../client-v220-audit.txt
          grep -q 'CLIENT_V220_AUDIT_OK' ../client-v220-audit.txt

      - name: Universal transaction regression tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/master-v2-domain-tests.js | tee ../domain-v220.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-v220.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-v220.txt
          grep -q 'ALL_TIMED_RESOURCE_TYPES_OK' ../domain-v220.txt

      - name: Compile Android 2.2.0
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac
