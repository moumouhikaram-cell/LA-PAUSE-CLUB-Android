name: Android v1.6 Stabilization CI

on:
  workflow_dispatch:
  push:
    branches:
      - android-v160-stabilization
    paths:
      - "v16-original-source/**"
      - ".github/workflows/android-v160-stabilization-ci.yml"

permissions:
  contents: read

jobs:
  stabilize-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Freeze historical v1.6 authority
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object v16-original-source/app/build.gradle.kts)" = "e40c86ad23fbf3042fc25d5b9e1a58139f172414"
          test "$(git hash-object v16-original-source/app/src/main/AndroidManifest.xml)" = "33636fd6f089837cb24c90083f687ff67ee8dc30"
          test "$(git hash-object v16-original-source/app/src/main/assets/app.css)" = "ee2d33799164b14d012abc0aecc3c94c5e214250"
          test "$(git hash-object v16-original-source/app/src/main/assets/app.js)" = "4cbafc7dfadcd086a0387e4b7bec3de4cc2074b1"
          test "$(git hash-object v16-original-source/app/src/main/assets/v13.css)" = "ee295d223f75d007b4db542b283bd194bba24fe1"
          test "$(git hash-object v16-original-source/app/src/main/assets/v13.js)" = "5b6d3468a314012c6ce793ce8de21630a18ea273"
          test "$(git hash-object v16-original-source/app/src/main/assets/v14.css)" = "1c4c083a2b4c164ed90658470159c2ea0baddfcf"
          test "$(git hash-object v16-original-source/app/src/main/assets/v14.js)" = "42134cceabd9c15dc52cfde30b7d5ca3818b1502"
          test "$(git hash-object v16-original-source/app/src/main/assets/v15.css)" = "8b5d7ef51d3f5d49cf06ee27f32585dca9a0c34e"
          test "$(git hash-object v16-original-source/app/src/main/assets/v15.js)" = "ab2288f35b39620b7c6c0401d342ce9349f17959"
          test "$(git hash-object v16-original-source/app/src/main/java/com/lapauseclub/manager/MainActivity.java)" = "bab0a577e167e42a4e35f430c7b6a6b85fabc305"
          test "$(git hash-object v16-original-source/app/src/main/java/com/lapauseclub/manager/core/CoreStore.java)" = "e5af1005e089e88782ac154b5bf72e33a82ac2e8"
          echo V160_HISTORICAL_AUTHORITY_FROZEN_OK

      - name: Existing product stabilization gates
        shell: bash
        run: |
          set -euxo pipefail
          A="v16-original-source/app/src/main/assets"
          INDEX="$A/index.html"
          grep -q '<script src="v15.js"></script>' "$INDEX"
          grep -q '<script src="stabilize-v160-existing.js"></script>' "$INDEX"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v16-original-source/app/src/main/assets/index.html').read_text()
          order=['app.js','v13.js','v14.js','v15.js','stabilize-v160-existing.js','enrich-v160-core.js']
          pos=[s.index(x) for x in order]
          assert pos==sorted(pos),(order,pos)
          print('V160_STABILIZATION_LOAD_ORDER_OK')
          PY
          node --check "$A/stabilize-v160-existing.js"
          ! grep -q 'location.reload' "$A/stabilize-v160-existing.js"
          ! grep -qi 'v250/' "$A/stabilize-v160-existing.js"
          ! grep -qi 'saas' "$A/stabilize-v160-existing.js"
          ! grep -qi 'onboarding' "$A/stabilize-v160-existing.js"
          node v16-original-source/tools/test-v160-stabilization-routes.js
          node v16-original-source/tools/test-v160-stabilization-interactions.js
          node v16-original-source/tools/test-v160-stabilization-shift-session.js
          # Existing enrichment gates still protect against regression while we stabilize the visible v1.6 product.
          node v16-original-source/tools/test-v160-enrichment.js
          node v16-original-source/tools/test-v160-core-recovery.js
          node v16-original-source/tools/test-v160-session-form.js
          node v16-original-source/tools/test-v160-session-start.js
          node v16-original-source/tools/test-v160-session-form-ui.js
          node v16-original-source/tools/test-v160-session-stack-health.js

      - name: Park unrelated modern modules outside APK build
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="v16-original-source/app/src/main/java/com/lapauseclub/manager"
          PARK_JAVA="$RUNNER_TEMP/parked-modern-java"
          mkdir -p "$PARK_JAVA"
          while IFS= read -r -d '' src; do
            rel="${src#$ROOT/}"
            case "$rel" in
              MainActivity.java|BootReceiver.java|SessionAlarmReceiver.java|core/CoreStore.java) ;;
              *) mkdir -p "$PARK_JAVA/$(dirname "$rel")"; mv "$src" "$PARK_JAVA/$rel" ;;
            esac
          done < <(find "$ROOT" -type f -name '*.java' -print0)
          test "$(find "$ROOT" -type f -name '*.java' | wc -l)" -eq 4

          ASSETS="v16-original-source/app/src/main/assets"
          PARK_ASSETS="$RUNNER_TEMP/parked-modern-assets"
          mkdir -p "$PARK_ASSETS"
          while IFS= read -r -d '' src; do
            rel="${src#$ASSETS/}"
            case "$rel" in
              app.css|app.js|index.html|logo.svg|v13.css|v13.js|v14.css|v14.js|v15.css|v15.js|stabilize-v160-existing.js|enrich-v160-*.js|\
              media/combat-dynamic.png|media/combat.svg|media/esport-dynamic.png|media/esport-team.jpg|media/esport.svg|\
              media/football-dynamic.png|media/football.svg|media/idle.svg|\
              media/products/chips.svg|media/products/chocolate.svg|media/products/cocacola.jpg|media/products/coffee.svg|media/products/cola.svg|media/products/energy.svg|media/products/fanta.jpg|media/products/lays.jpg|media/products/oreo.jpg|media/products/redbull.jpg|media/products/snickers.jpg|media/products/sprite.jpg|media/products/twix.jpg|media/products/water.svg|\
              media/ps5-available.png|media/ps5-default.jpg|media/racing-dynamic.png|media/racing.svg|media/sim-racing.jpg|media/sim-vip.png|media/sim.svg|media/tactical-dynamic.png|media/tactical.jpg|media/tactical.svg) ;;
              *) mkdir -p "$PARK_ASSETS/$(dirname "$rel")"; mv "$src" "$PARK_ASSETS/$rel" ;;
            esac
          done < <(find "$ASSETS" -type f -print0)
          ! find "$ASSETS" -type f | grep -q '/v250/'
          ! find "$ASSETS" -type f | grep -qi 'saas'
          ! find "$ASSETS" -type f | grep -qi 'onboarding'

      - name: Build stabilization APK
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify stabilization package
        shell: bash
        run: |
          set -euxo pipefail
          APK="v16-original-source/app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep '^assets/' | sort > v160-stabilization-assets.txt
          grep -qx 'assets/app.js' v160-stabilization-assets.txt
          grep -qx 'assets/v15.js' v160-stabilization-assets.txt
          grep -qx 'assets/stabilize-v160-existing.js' v160-stabilization-assets.txt
          ! grep -q '^assets/v250/' v160-stabilization-assets.txt
          ! grep -qi 'saas' v160-stabilization-assets.txt
          ! grep -qi 'onboarding' v160-stabilization-assets.txt
          sha256sum "$APK" | tee v160-stabilization-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-v160-STABILIZATION-DEBUG
          path: |
            v16-original-source/app/build/outputs/apk/debug/app-debug.apk
            v160-stabilization-assets.txt
            v160-stabilization-sha256.txt
          if-no-files-found: error
          retention-days: 30
