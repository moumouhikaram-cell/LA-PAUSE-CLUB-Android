name: Android v1.7.2 v1.6 UI Frozen CI

on:
  push:
    branches:
      - android-v170-operator-experience
    paths:
      - "v16-original-source/**"
      - ".github/workflows/android-v172-v160-ui-frozen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Freeze exact v1.6 visual authority
        shell: bash
        run: |
          set -euxo pipefail
          A="v16-original-source/app/src/main/assets"
          test "$(git hash-object "$A/index.html")" = "abeeb980d307ce6b5f63648957c32a8cb03b714f"
          test "$(git hash-object "$A/app.css")" = "ee2d33799164b14d012abc0aecc3c94c5e214250"
          test "$(git hash-object "$A/app.js")" = "4cbafc7dfadcd086a0387e4b7bec3de4cc2074b1"
          test "$(git hash-object "$A/v13.css")" = "ee295d223f75d007b4db542b283bd194bba24fe1"
          test "$(git hash-object "$A/v13.js")" = "5b6d3468a314012c6ce793ce8de21630a18ea273"
          test "$(git hash-object "$A/v14.css")" = "1c4c083a2b4c164ed90658470159c2ea0baddfcf"
          test "$(git hash-object "$A/v14.js")" = "42134cceabd9c15dc52cfde30b7d5ca3818b1502"
          test "$(git hash-object "$A/v15.css")" = "8b5d7ef51d3f5d49cf06ee27f32585dca9a0c34e"
          test "$(git hash-object "$A/v15.js")" = "ab2288f35b39620b7c6c0401d342ce9349f17959"
          ! grep -q 'operator-v170' "$A/index.html"
          ! grep -q 'operator-shell-v171' "$A/index.html"
          ! grep -q 'CONTROL CENTER · OPÉRATEUR' "$A/index.html"
          grep -q 'versionCode = 22' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "1.7.2"' v16-original-source/app/build.gradle.kts
          grep -q 'applicationId = "com.lapauseclub.manager"' v16-original-source/app/build.gradle.kts
          echo V172_V160_UI_HASHES_FROZEN_OK

      - name: Run v1.6 product contracts
        shell: bash
        run: |
          set -euxo pipefail
          node v16-original-source/tools/test-v160-design-frozen.js
          node v16-original-source/tools/test-v160-stabilization-navigation.js
          node v16-original-source/tools/test-v160-native-back-contract.js
          node v16-original-source/tools/test-v160-stabilization-routes.js
          node v16-original-source/tools/test-v160-stabilization-interactions.js
          node v16-original-source/tools/test-v160-stabilization-shift-session.js
          node v16-original-source/tools/test-v160-stabilization-cash-dom.js
          node v16-original-source/tools/test-v160-stabilization-accounting.js
          node v16-original-source/tools/test-v160-stabilization-prepaid-sales.js
          node v16-original-source/tools/test-v160-stabilization-booking-refund.js
          node v16-original-source/tools/test-v160-enrichment.js
          node v16-original-source/tools/test-v160-core-recovery.js
          node v16-original-source/tools/test-v160-session-form.js
          node v16-original-source/tools/test-v160-session-start.js
          node v16-original-source/tools/test-v160-session-form-ui.js
          node v16-original-source/tools/test-v160-session-stack-health.js

      - name: Park unrelated modules and build
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="v16-original-source/app/src/main/java/com/lapauseclub/manager"
          PARK_JAVA="$RUNNER_TEMP/parked-modern-java"; mkdir -p "$PARK_JAVA"
          while IFS= read -r -d '' src; do
            rel="${src#$ROOT/}"
            case "$rel" in
              MainActivity.java|BootReceiver.java|SessionAlarmReceiver.java|core/CoreStore.java) ;;
              *) mkdir -p "$PARK_JAVA/$(dirname "$rel")"; mv "$src" "$PARK_JAVA/$rel" ;;
            esac
          done < <(find "$ROOT" -type f -name '*.java' -print0)

          ASSETS="v16-original-source/app/src/main/assets"
          PARK_ASSETS="$RUNNER_TEMP/parked-modern-assets"; mkdir -p "$PARK_ASSETS"
          while IFS= read -r -d '' src; do
            rel="${src#$ASSETS/}"
            case "$rel" in
              app.css|app.js|index.html|logo.svg|v13.css|v13.js|v14.css|v14.js|v15.css|v15.js|stabilize-v160-*.js|enrich-v160-*.js|\
              media/combat-dynamic.png|media/combat.svg|media/esport-dynamic.png|media/esport-team.jpg|media/esport.svg|\
              media/football-dynamic.png|media/football.svg|media/idle.svg|\
              media/products/chips.svg|media/products/chocolate.svg|media/products/cocacola.jpg|media/products/coffee.svg|media/products/cola.svg|media/products/energy.svg|media/products/fanta.jpg|media/products/lays.jpg|media/products/oreo.jpg|media/products/redbull.jpg|media/products/snickers.jpg|media/products/sprite.jpg|media/products/twix.jpg|media/products/water.svg|\
              media/ps5-available.png|media/ps5-default.jpg|media/racing-dynamic.png|media/racing.svg|media/sim-racing.jpg|media/sim-vip.png|media/sim.svg|media/tactical-dynamic.png|media/tactical.jpg|media/tactical.svg) ;;
              *) mkdir -p "$PARK_ASSETS/$(dirname "$rel")"; mv "$src" "$PARK_ASSETS/$rel" ;;
            esac
          done < <(find "$ASSETS" -type f -print0)

          cd v16-original-source
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify frozen UI APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="v16-original-source/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee v172-badging.txt
          grep "package: name='com.lapauseclub.manager'" v172-badging.txt
          grep "versionCode='22'" v172-badging.txt
          grep "versionName='1.7.2'" v172-badging.txt
          unzip -Z1 "$APK" | sort > v172-assets.txt
          for f in assets/media/ps5-available.png assets/media/sim-vip.png assets/media/football-dynamic.png assets/media/racing-dynamic.png assets/media/combat-dynamic.png assets/media/tactical-dynamic.png assets/media/esport-dynamic.png; do grep -qx "$f" v172-assets.txt; done
          grep -qx 'assets/stabilize-v160-navigation.js' v172-assets.txt
          ! grep -q 'operator-v170' v172-assets.txt
          ! grep -q 'operator-shell-v171' v172-assets.txt
          sha256sum "$APK" | tee v172-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-v1.7.2-V160-UI-FROZEN-DEBUG
          path: |
            v16-original-source/app/build/outputs/apk/debug/app-debug.apk
            v172-badging.txt
            v172-assets.txt
            v172-sha256.txt
          if-no-files-found: error
          retention-days: 30
