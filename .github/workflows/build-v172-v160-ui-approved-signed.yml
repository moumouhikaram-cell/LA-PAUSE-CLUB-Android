name: Android v1.7.2 v1.6 UI Approved Signed Release

on:
  push:
    branches:
      - android-v170-operator-experience
    paths:
      - ".github/release/v172-v160-ui-approved-sha.txt"

permissions:
  contents: read
  actions: read

jobs:
  build-approved-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release trigger
        uses: actions/checkout@v4

      - name: Read and verify approved green SHA
        id: approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(tr -d '[:space:]' < .github/release/v172-v160-ui-approved-sha.txt)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          python3 - "$SHA" <<'PY'
          import json, os, sys, urllib.request
          sha=sys.argv[1]; repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=50'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r:data=json.load(r)
          required={'Android v1.7.2 v1.6 UI Frozen CI','Android v1.7.2 v1.6 UI Native Smoke'}
          good={x.get('name') for x in data.get('workflow_runs',[]) if x.get('conclusion')=='success'}
          missing=required-good
          if missing: raise SystemExit(f'Missing successful release gates for {sha}: {sorted(missing)}')
          print('V172_V160_UI_APPROVED_GREEN_SHA_OK',sha)
          PY

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.approval.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Re-prove exact v1.6 visual contract
        shell: bash
        run: |
          set -euxo pipefail
          A="v16-original-source/app/src/main/assets"
          test "$(git hash-object "$A/index.html")" = "abeeb980d307ce6b5f63648957c32a8cb03b714f"
          test "$(git hash-object "$A/app.css")" = "ee2d33799164b14d012abc0aecc3c94c5e214250"
          test "$(git hash-object "$A/app.js")" = "4cbafc7dfadcd086a0387e4b7bec3de4cc2074b1"
          test "$(git hash-object "$A/v13.css")" = "ee295d223f75d007b4db542b283bd194bba24fe1"
          test "$(git hash-object "$A/v13.js")" = "5b6d3468a314012c6ce793ce8de21630a18ea273"
          test "$(git hash-object "$A/v14.css")" = "1c4c083a2b4c164ed90658470159c2ea0baddfcf"
          test "$(git hash-object "$A/v14.js")" = "42134cceabd9c15dc52cfde30b7d5ca3818b1502"
          test "$(git hash-object "$A/v15.css")" = "8b5d7ef51d3f5d49cf06ee27f32585dca9a0c34e"
          test "$(git hash-object "$A/v15.js")" = "ab2288f35b39620b7c6c0401d342ce9349f17959"
          grep -q 'versionCode = 22' v16-original-source/app/build.gradle.kts
          grep -q 'versionName = "1.7.2"' v16-original-source/app/build.gradle.kts
          ! grep -q 'operator-v170' "$A/index.html"
          ! grep -q 'operator-shell-v171' "$A/index.html"
          node v16-original-source/tools/test-v160-design-frozen.js
          node v16-original-source/tools/test-v160-stabilization-navigation.js
          node v16-original-source/tools/test-v160-native-back-contract.js
          node v16-original-source/tools/test-v160-stabilization-routes.js
          node v16-original-source/tools/test-v160-stabilization-interactions.js
          node v16-original-source/tools/test-v160-stabilization-shift-session.js
          node v16-original-source/tools/test-v160-stabilization-cash-dom.js
          node v16-original-source/tools/test-v160-stabilization-accounting.js
          node v16-original-source/tools/test-v160-stabilization-prepaid-sales.js
          node v16-original-source/tools/test-v160-stabilization-booking-refund.js

      - name: Park unrelated modules
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="v16-original-source/app/src/main/java/com/lapauseclub/manager"
          PARK_JAVA="$RUNNER_TEMP/parked-modern-java"; mkdir -p "$PARK_JAVA"
          while IFS= read -r -d '' src; do
            rel="${src#$ROOT/}"
            case "$rel" in
              MainActivity.java|BootReceiver.java|SessionAlarmReceiver.java|core/CoreStore.java) ;;
              *) mkdir -p "$PARK_JAVA/$(dirname "$rel")"; mv "$src" "$PARK_JAVA/$rel" ;;
            esac
          done < <(find "$ROOT" -type f -name '*.java' -print0)
          ASSETS="v16-original-source/app/src/main/assets"
          PARK_ASSETS="$RUNNER_TEMP/parked-modern-assets"; mkdir -p "$PARK_ASSETS"
          while IFS= read -r -d '' src; do
            rel="${src#$ASSETS/}"
            case "$rel" in
              app.css|app.js|index.html|logo.svg|v13.css|v13.js|v14.css|v14.js|v15.css|v15.js|stabilize-v160-*.js|enrich-v160-*.js|\
              media/combat-dynamic.png|media/combat.svg|media/esport-dynamic.png|media/esport-team.jpg|media/esport.svg|\
              media/football-dynamic.png|media/football.svg|media/idle.svg|\
              media/products/chips.svg|media/products/chocolate.svg|media/products/cocacola.jpg|media/products/coffee.svg|media/products/cola.svg|media/products/energy.svg|media/products/fanta.jpg|media/products/lays.jpg|media/products/oreo.jpg|media/products/redbull.jpg|media/products/snickers.jpg|media/products/sprite.jpg|media/products/twix.jpg|media/products/water.svg|\
              media/ps5-available.png|media/ps5-default.jpg|media/racing-dynamic.png|media/racing.svg|media/sim-racing.jpg|media/sim-vip.png|media/sim.svg|media/tactical-dynamic.png|media/tactical.jpg|media/tactical.svg) ;;
              *) mkdir -p "$PARK_ASSETS/$(dirname "$rel")"; mv "$src" "$PARK_ASSETS/$rel" ;;
            esac
          done < <(find "$ASSETS" -type f -print0)

      - name: Restore permanent signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"; test -n "$KS_PASS"; test -n "$KEY_ALIAS"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/la-pause-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/la-pause-release.p12" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Build exact approved release
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPROVED_SHA: ${{ steps.approval.outputs.sha }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          U="v16-original-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$RUNNER_TEMP/la-pause-v172-aligned.apk"
          S="LA-PAUSE-CLUB-Manager-v1.7.2-V160-DASH-FROZEN-SIGNED.apk"
          "$BT/zipalign" -f -p 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/la-pause-release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee signed-certificate.txt
          "$BT/aapt" dump badging "$S" | tee signed-badging.txt
          grep "package: name='com.lapauseclub.manager'" signed-badging.txt
          grep "versionCode='22'" signed-badging.txt
          grep "versionName='1.7.2'" signed-badging.txt
          unzip -Z1 "$S" | sort > signed-assets.txt
          for f in assets/media/ps5-available.png assets/media/sim-vip.png assets/media/football-dynamic.png assets/media/racing-dynamic.png assets/media/combat-dynamic.png assets/media/tactical-dynamic.png assets/media/esport-dynamic.png; do grep -qx "$f" signed-assets.txt; done
          ! grep -q 'operator-v170' signed-assets.txt
          ! grep -q 'operator-shell-v171' signed-assets.txt
          printf '%s\n' "$APPROVED_SHA" > signed-source-sha.txt
          sha256sum "$S" | tee signed-sha256.txt

      - name: Cleanup key material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/la-pause-release.p12" "$RUNNER_TEMP/la-pause-v172-aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.7.2-V160-DASH-FROZEN-SIGNED
          path: |
            LA-PAUSE-CLUB-Manager-v1.7.2-V160-DASH-FROZEN-SIGNED.apk
            signed-certificate.txt
            signed-badging.txt
            signed-assets.txt
            signed-sha256.txt
            signed-source-sha.txt
          if-no-files-found: error
          retention-days: 30
