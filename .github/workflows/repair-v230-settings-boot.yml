name: Repair v2.3 Settings Legacy Boot

on:
  workflow_dispatch:
  push:
    branches:
      - android-client-final-v230
    paths:
      - ".github/workflows/repair-v230-settings-boot.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-client-final-v230
          fetch-depth: 0
      - name: Patch legacy first render safely
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v16-original-source/app/src/main/assets/app.js')
          s=p.read_text()
          old="renderView();tick();setInterval(tick,1000);"
          new="// v2.3 boot guard: legacy app.js renders before the modern Settings layers are loaded.\n// Never let that historical first render enter a persisted modern Settings subsection.\nif(currentView==='settings'&&settingsSection){settingsSection=null;state.ui.settingsSection=null;}\nrenderView();tick();setInterval(tick,1000);"
          if old not in s:
              raise SystemExit('Expected legacy boot marker not found')
          if 'v2.3 boot guard: legacy app.js renders before the modern Settings layers are loaded.' in s:
              raise SystemExit('Repair already applied')
          p.write_text(s.replace(old,new,1))
          PY
          node --check v16-original-source/app/src/main/assets/app.js
          grep -n "v2.3 boot guard" v16-original-source/app/src/main/assets/app.js
      - name: Commit repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "moumouhikaram-cell"
          git config user.email "moumouhi.karam@gmail.com"
          git add v16-original-source/app/src/main/assets/app.js
          git commit -m "fix(v230): guard legacy settings first render"
          git push origin HEAD:android-client-final-v230
