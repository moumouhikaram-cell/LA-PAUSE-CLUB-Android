name: Build LA PAUSE CLUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LA_PAUSE_CLUB_Android_GitHubReady.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          test -f LA_PAUSE_CLUB_Android_GitHubReady.zip
          unzip -o LA_PAUSE_CLUB_Android_GitHubReady.zip -d project

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Build APK
        working-directory: project
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | head -20
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk LA-PAUSE-CLUB-Manager-v1.1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LA-PAUSE-CLUB-Manager-v1.1.1-debug
          path: LA-PAUSE-CLUB-Manager-v1.1.1-debug.apk
          if-no-files-found: error
          retention-days: 30
