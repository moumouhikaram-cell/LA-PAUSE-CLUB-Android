name: LA PAUSE OS Client Final CI

on:
  workflow_dispatch:
  push:
    branches: [android-p1-monster-dev]
    paths:
      - "v16-original-source/app/src/main/assets/client-shell.*"
      - "v16-original-source/app/src/main/assets/index.html"
      - "v16-original-source/tools/client-shell-audit.js"
      - "v16-original-source/tools/client-route-audit.js"
      - "v16-original-source/tools/master-v2-domain-tests.js"
      - "v16-original-source/app/src/main/assets/p1-core.js"
      - ".github/workflows/client-final-ci.yml"

permissions:
  contents: read

jobs:
  client-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Single-shell client audit
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/client-shell.js
          node tools/client-shell-audit.js
          node tools/client-route-audit.js
      - name: Universal resource domain tests
        working-directory: v16-original-source
        shell: bash
        run: |
          set -euxo pipefail
          node tools/master-v2-domain-tests.js | tee ../domain-tests.txt
          grep -q 'MASTER_V2_DOMAIN_TESTS_OK' ../domain-tests.txt
          grep -q 'UNIVERSAL_RESOURCE_SESSIONS_OK' ../domain-tests.txt
      - name: Compile Android
        working-directory: v16-original-source
        run: gradle --no-daemon --stacktrace :app:compileReleaseJavaWithJavac
